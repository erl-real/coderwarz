// ===== VIRUS TAB =====
const VIRUS_STATS = [
  { key: "speed", name: "Speed" },
  { key: "strength", name: "Strength" },
  { key: "reach", name: "Reach" },
  { key: "lifespan", name: "Lifespan" }
];

// Gooey orb looks. Keys mirror the shader panel: size/deformation/
// lobes/morph/rotation, colors, lighting, liquid. Grown viruses drift
// toward STRONG as they feed (see mutateVirusLook).
const VIRUS_LOOK_BASE = { size: 0.2, deform: 0, lobes: 0.4, morph: 0, rot: 0, bg: "#070709", blend: "Auto", rimA: "#c2cbe6", rimB: "#8893b5", glowA: "#aeb8d8", glowB: "#6e7799", specular: 1.6, glint: 220, glow: 0.55, flow: 0.45, swirl: 2.2, brightness: 0.85, filaments: 1.2, core: 0.2 };
const VIRUS_LOOK_DEAD = { size: 0.2, deform: 0, lobes: 0.4, morph: 0, rot: 0, bg: "#000000", blend: "Ink", rimA: "#000000", rimB: "#b7b7b7", glowA: "#44db44", glowB: "#20a585", specular: 0, glint: 300, glow: 0, flow: 0, swirl: 1, brightness: 0, filaments: 0, core: 0 };
const VIRUS_LOOK_START = { size: 0.2, deform: 0.06, lobes: 1.05, morph: 1.08, rot: 0.02, bg: "#04120c", blend: "Ink", rimA: "#9cff4d", rimB: "#00e5a0", glowA: "#57ff3c", glowB: "#00ffc8", specular: 2.3, glint: 235, glow: 0.2, flow: 0.4, swirl: 1.75, brightness: 0.85, filaments: 1.7, core: 0.28 };
const VIRUS_LOOK_STRONG = { size: 0.39, deform: 0.47, lobes: 2.1, morph: 1.4, rot: 0.1, bg: "#000000", blend: "Ink", rimA: "#185ce2", rimB: "#38ff9f", glowA: "#a718ff", glowB: "#180593", specular: 2.1, glint: 215, glow: 1.5, flow: 2, swirl: 4, brightness: 0.75, filaments: 3, core: 1 };

const LOOK_RANGES = { size: [0.2, 0.4], deform: [0, 0.8], lobes: [0.4, 3.0], morph: [0, 2], rot: [0, 0.6], specular: [0, 3], glint: [20, 300], glow: [0, 1.5], flow: [0, 2], swirl: [1, 4], brightness: [0, 2.5], filaments: [0, 3], core: [0, 1] };
const LOOK_COLORS = ["rimA", "rimB", "glowA", "glowB"];

function hexToRgb01(hex) {
  let h = String(hex).replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const n = parseInt(h, 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

function hexLerp(a, b, t) {
  const A = hexToRgb01(a), B = hexToRgb01(b);
  const c = A.map((v, i) => Math.round((v + (B[i] - v) * t) * 255));
  return "#" + c.map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, "0")).join("");
}

function virusLookNow() {
  const v = G.virus;
  if (!v || !v.alive) return VIRUS_LOOK_DEAD;
  return v.look || VIRUS_LOOK_START;
}

// Each feed randomly mutates a few look params toward the STRONG look.
function mutateVirusLook() {
  const v = G.virus;
  if (!v || !v.alive) return;
  if (!v.look) v.look = { ...VIRUS_LOOK_START };
  const S = VIRUS_LOOK_STRONG;
  for (let i = 0; i < 3; i++) {
    if (Math.random() < 0.35) {
      const k = LOOK_COLORS[Math.floor(Math.random() * LOOK_COLORS.length)];
      v.look[k] = hexLerp(v.look[k], S[k], 0.15 + Math.random() * 0.2);
    } else {
      const keys = Object.keys(LOOK_RANGES);
      const k = keys[Math.floor(Math.random() * keys.length)];
      const range = LOOK_RANGES[k];
      const t = 0.12 + Math.random() * 0.18;
      const v0 = Number(v.look[k]) || 0;
      v.look[k] = Math.max(range[0], Math.min(range[1], v0 + (S[k] - v0) * t + (Math.random() - 0.5) * 0.02 * (range[1] - range[0])));
    }
  }
}

function virusLevel(xp) {
  if (xp >= 200) return 5;
  if (xp >= 100) return 4;
  if (xp >= 50) return 3;
  if (xp >= 20) return 2;
  if (xp >= 5) return 1;
  return 0;
}

function virusDaysSinceFed() {
  return Math.max(0, G.day - G.virus.lastFedDay);
}

function updateVirusStatus() {
  if (!G.virus.alive) return;
  const days = virusDaysSinceFed();
  G.virus.weakened = days >= 7;
  if (days >= 14) {
    G.virus.alive = false;
    G.virus.weakened = false;
    addLog("Your virus died after going unfed for 2 weeks. You need a new virus.", "bad");
  }
}

function canFeed(f) {
  if (!f || !f.infected || f.fixed) return false;
  if (f.scanned) return true;
  // with a PC, blocked strains (sealed/dark) can go straight to the virus
  return hasPcDevice() && (f.strain === "sealed" || f.strain === "dark");
}

function virusFoodCount() {
  return G.hack.files.filter(canFeed).length;
}

function feedVirus(amount) {
  updateVirusStatus();
  if (!G.virus.alive) { renderVirus(); return; }
  const available = virusFoodCount();
  if (available <= 0) { addLog("No viruses available to feed.", "bad"); renderVirus(); return; }
  let count = amount === "all" ? available : Math.max(0, Math.min(available, Math.floor(amount)));
  if (count <= 0) return;

  const infected = G.hack.files.filter(canFeed).slice(0, count);
  if (infected.length) {
    const fedIds = new Set(infected.map(f => f.id));
    infected.forEach(f => {
      const stat = VIRUS_STATS[Math.floor(Math.random() * VIRUS_STATS.length)];
      G.virus.stats[stat.key].xp += 1;
      G.virus.totalFed++;
    });
    // Growing shifts the orb's look toward STRONG, a few random params at a time.
    mutateVirusLook();
    G.hack.files = G.hack.files.filter(f => !fedIds.has(f.id));
  }

  G.virus.lastFedDay = G.day;
  G.virus.weakened = false;
  // XP changes are persisted directly above.
  addLog(`Fed your virus ${infected.length} virus${infected.length === 1 ? "" : "es"}.`, "good");
  renderVirus();
}

function createNewVirus() {
  if (G.virus.alive) return;
  G.virus = {
    alive: true,
    bornDay: G.day,
    lastFedDay: G.day,
    weakened: false,
    totalFed: 0,
    look: { ...VIRUS_LOOK_START },
    stats: {
      speed: { xp: 0 },
      strength: { xp: 0 },
      reach: { xp: 0 },
      lifespan: { xp: 0 }
    }
  };
  addLog("A new blank virus has been created.", "good");
  renderVirus();
}

const VIRUS_VERT = `#version 300 es
layout(location=0) in vec2 a_pos;
out vec2 v_uv;
void main(){ v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const VIRUS_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;
uniform float u_time;
uniform vec2  u_res;
uniform float u_radius;
uniform float u_deform;
uniform float u_freq;
uniform float u_morphSpeed;
uniform float u_rotSpeed;
uniform float u_specular;
uniform float u_shininess;
uniform float u_glowStrength;
uniform vec3  u_colBlue;
uniform vec3  u_colMag;
uniform vec3  u_glowA;
uniform vec3  u_glowB;
uniform float u_liquidSpeed;
uniform float u_liquidScale;
uniform float u_liquidBright;
uniform float u_filament;
uniform float u_core;
uniform vec3  u_bg;
uniform float u_blend;
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float blobField(vec3 p){
  float t = u_time * u_morphSpeed;
  float f = u_freq;
  float d = 0.0;
  d += sin(p.x * 2.6 * f + t * 1.00);
  d += sin(p.y * 2.9 * f - t * 0.80 + 1.3);
  d += sin(p.z * 3.2 * f + t * 1.20 + 2.7);
  d += sin((p.x + p.z) * 2.2 * f - t * 0.90 + 4.1);
  d += sin((p.y - p.x) * 2.4 * f + t * 0.70 + 0.6);
  return d * 0.2;
}
float mapBlob(vec3 p){
  float t = u_time * u_rotSpeed;
  p.xy *= rot(t * 0.7);
  p.yz *= rot(t * 0.5);
  float r = u_radius + u_deform * blobField(p);
  return length(p) - r;
}
vec3 calcNormal(vec3 p){
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(
    mapBlob(p + e.xyy) - mapBlob(p - e.xyy),
    mapBlob(p + e.yxy) - mapBlob(p - e.yxy),
    mapBlob(p + e.yyx) - mapBlob(p - e.yyx)));
}
float hash13(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float vnoise3(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash13(i + vec3(0,0,0)), hash13(i + vec3(1,0,0)), f.x),
                 mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x),
                 mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm3(vec3 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 3; i++){ v += a * vnoise3(p); p *= 2.03; a *= 0.5; } return v; }
float liquid(vec3 p){
  float t = u_time * u_liquidSpeed;
  p *= u_liquidScale;
  p.xy *= rot(t * 0.15);
  p.yz *= rot(t * 0.10);
  vec3 w = vec3(fbm3(p + t * 0.2), fbm3(p + vec3(4.3, 1.2, -t * 0.15)), fbm3(p.zxy + vec3(7.7, 2.3, t * 0.10)));
  return fbm3(p + 1.8 * w);
}
void main(){
  vec2 p = v_uv * 2.0 - 1.0;
  p.x *= u_res.x / u_res.y;
  vec3 ro = vec3(0.0, 0.0, 3.0);
  vec3 rd = normalize(vec3(p, -1.8));
  float t = 0.0;
  bool hit = false;
  vec3 pos = ro;
  float minD = 1e3;
  for (int i = 0; i < 160; i++) {
    pos = ro + rd * t;
    float d = mapBlob(pos);
    minD = min(minD, d);
    if (d < 0.001) { hit = true; break; }
    t += d * 0.40;
    if (t > 6.0) break;
  }
  vec3 E = vec3(0.0);
  if (hit) {
    vec3 n = calcNormal(pos);
    vec3 v = -rd;
    float fres = pow(1.0 - max(dot(n, v), 0.0), 3.0);
    vec3 rp = pos + rd * 0.04;
    float trans = 1.0;
    vec3 inner = vec3(0.0);
    for (int k = 0; k < 10; k++) {
      float raw = liquid(rp);
      float dens = smoothstep(0.30, 0.70, raw);
      float fil = pow(1.0 - abs(2.0 * raw - 1.0), 5.0);
      vec3 c = mix(u_colMag, u_colBlue, 0.5 + 0.5 * sin(raw * 6.0 + u_time * 0.3 + rp.y * 2.5));
      vec3 emit = c * dens * 0.55 + c * fil * u_filament + vec3(1.0) * pow(fil, 3.0) * u_filament * 0.4;
      emit += u_colBlue * smoothstep(0.5, 0.0, length(rp)) * u_core;
      inner += trans * emit * 0.17;
      trans *= 0.84;
      rp += rd * 0.11;
      if (length(rp) > 1.0) break;
    }
    E += inner * (1.0 - fres * 0.6) * u_liquidBright;
    vec3 rim = mix(u_colMag, u_colBlue, 0.5 + 0.5 * (n.x * 0.7 + n.y * 0.45));
    E += rim * fres * 1.3;
    vec3 l1 = normalize(vec3(0.6, 0.85, 0.6));
    vec3 l2 = normalize(vec3(-0.7, 0.25, 0.55));
    vec3 h1 = normalize(l1 + v);
    vec3 h2 = normalize(l2 + v);
    E += vec3(1.0) * pow(max(dot(n, h1), 0.0), u_shininess) * 1.3 * u_specular;
    E += vec3(0.8, 0.9, 1.0) * pow(max(dot(n, h2), 0.0), u_shininess * 0.45) * 0.6 * u_specular;
  } else {
    float g = exp(-minD * 5.5);
    float ang = atan(rd.y, rd.x);
    vec3 gc = mix(u_glowA, u_glowB, 0.5 + 0.5 * sin(ang * 3.0 + u_time * 0.5));
    E += (gc * g * 1.4 + vec3(0.6, 0.8, 1.0) * pow(g, 3.0) * 0.7) * u_glowStrength;
  }
  vec3 glowCol = u_bg + E;
  float cov = clamp(max(E.r, max(E.g, E.b)), 0.0, 1.0);
  vec3 inkCol = mix(u_bg, E / (1.0 + E), cov);
  vec3 col = mix(glowCol, inkCol, u_blend);
  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

let virusGL = null;
let virusRaf = 0;

function virusBlendFor(v) {
  if (v.blend === "Glow") return 0;
  if (v.blend === "Ink") return 1;
  const c = hexToRgb01(v.bg);
  const lum = 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
  return Math.min(Math.max((lum - 0.35) / 0.30, 0), 1);
}

function initVirusGL(canvas) {
  try {
    if (virusGL && virusGL.canvas === canvas) return virusGL;
    stopVirusOrb();
    const gl = canvas.getContext("webgl2", { antialias: false, alpha: false });
    if (!gl) return null;
    const compile = (type, src) => {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) return null;
      return sh;
    };
    const vs = compile(gl.VERTEX_SHADER, VIRUS_VERT);
    const fs = compile(gl.FRAGMENT_SHADER, VIRUS_FRAG);
    if (!vs || !fs) return null;
    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    const U = {};
    ["time", "res", "radius", "deform", "freq", "morphSpeed", "rotSpeed", "specular", "shininess", "glowStrength", "colBlue", "colMag", "glowA", "glowB", "liquidSpeed", "liquidScale", "liquidBright", "filament", "core", "bg", "blend"].forEach(k => {
      U[k] = gl.getUniformLocation(prog, "u_" + k);
    });
    virusGL = { gl, prog, U, canvas };
    return virusGL;
  } catch (e) { return null; }
}

function stopVirusOrb() {
  if (virusRaf) { try { cancelAnimationFrame(virusRaf); } catch (e) {} virusRaf = 0; }
  virusGL = null;
}

function drawVirusOrbFrame(time) {
  const ctx = virusGL;
  if (!ctx) return;
  const v = virusLookNow();
  const gl = ctx.gl, U = ctx.U;
  gl.uniform1f(U.time, time);
  gl.uniform2f(U.res, ctx.canvas.width, ctx.canvas.height);
  gl.uniform1f(U.radius, v.size);
  gl.uniform1f(U.deform, v.deform);
  gl.uniform1f(U.freq, v.lobes);
  gl.uniform1f(U.morphSpeed, v.morph);
  gl.uniform1f(U.rotSpeed, v.rot);
  gl.uniform1f(U.specular, v.specular);
  gl.uniform1f(U.shininess, v.glint);
  gl.uniform1f(U.glowStrength, v.glow);
  gl.uniform3fv(U.colBlue, hexToRgb01(v.rimA));
  gl.uniform3fv(U.colMag, hexToRgb01(v.rimB));
  gl.uniform3fv(U.glowA, hexToRgb01(v.glowA));
  gl.uniform3fv(U.glowB, hexToRgb01(v.glowB));
  gl.uniform1f(U.liquidSpeed, v.flow);
  gl.uniform1f(U.liquidScale, v.swirl);
  gl.uniform1f(U.liquidBright, v.brightness);
  gl.uniform1f(U.filament, v.filaments);
  gl.uniform1f(U.core, v.core);
  gl.uniform3fv(U.bg, hexToRgb01(v.bg));
  gl.uniform1f(U.blend, virusBlendFor(v));
  const bg = hexToRgb01(v.bg);
  gl.clearColor(bg[0], bg[1], bg[2], 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function virusOrbLoop(now) {
  virusRaf = 0;
  const canvas = document.getElementById("virusOrb");
  if (!canvas || !virusGL || virusGL.canvas !== canvas || G.tab !== "virus" || document.hidden) return;
  // Dead viruses hold one frozen frame instead of a loop.
  if (!G.virus || !G.virus.alive) { drawVirusOrbFrame(1.0); return; }
  drawVirusOrbFrame(now * 0.001);
  virusRaf = requestAnimationFrame(virusOrbLoop);
}

function drawVirusOrbFallback(canvas) {
  try {
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    const w = canvas.width = Math.max(280, Math.min(720, canvas.clientWidth * 2));
    const h = canvas.height = 460;
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.30;
    ctx.fillStyle = "#020202";
    ctx.fillRect(0, 0, w, h);
    const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.45, r * 0.08, cx, cy, r);
    g.addColorStop(0, "#b8ffd0");
    g.addColorStop(0.18, "#35ff75");
    g.addColorStop(0.58, "#00a83c");
    g.addColorStop(0.86, "#00451c");
    g.addColorStop(1, "#001b0b");
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
  } catch (e) {}
}

function drawVirusOrb() {
  const canvas = document.getElementById("virusOrb");
  if (!canvas) { stopVirusOrb(); return; }
  // Cheap part only: size the canvas (CSS bg covers it meanwhile).
  // Shader compile + first frame happen async so tab opens/feeds stay fast.
  canvas.width = Math.max(280, Math.min(560, (canvas.clientWidth || 320) * 1.5));
  canvas.height = 400;
  stopVirusOrb();
  setTimeout(() => {
    if (document.getElementById("virusOrb") !== canvas || G.tab !== "virus") return;
    if (!initVirusGL(canvas)) { drawVirusOrbFallback(canvas); return; }
    if (!virusRaf) virusRaf = requestAnimationFrame(virusOrbLoop);
  }, 30);
}

function makeMarketAsset(a, historyIndex) {
  const multipliers = MARKET_HISTORY[historyIndex % MARKET_HISTORY.length];
  const history = multipliers.map(x => a.base * x);
  const price = history[history.length - 1];
  const prev = history[history.length - 2] || price;
  const change = prev > 0 ? ((price - prev) / prev * 100) : 0;
  return { ...a, price, prev, change, history, preGameHistory: [...history], eventAffected: false, lastDayChange: change };
}

function initMarket() {
  const m = G.market;
  m.stocks = STOCKS.map((s, i) => makeMarketAsset(s, i));
  m.crypto = CRYPTOS.map((c, i) => makeMarketAsset(c, i + STOCKS.length));
  m.portfolio = { stocks: {}, crypto: { DOGE: 6 } };
  m.watchlist = [];
  m._selected = null;
  m._tab = "bank";
}

function updateMarket() {
  const m = G.market;
  const move = asset => {
    asset.prev = asset.price;
    const drift = (Math.random() - 0.48) * asset.vol * asset.base;
    const spike = Math.random() < (asset.vol > 0.2 ? 0.10 : 0.05) ? (Math.random() - 0.5) * asset.base * asset.vol : 0;
    asset.price = Math.max(asset.base >= 1 ? 1 : 0.01, +(asset.price + drift + spike).toFixed(asset.base >= 1 ? 0 : 4));
    asset.change = asset.prev > 0 ? ((asset.price - asset.prev) / asset.prev * 100) : 0;
    asset.lastDayChange = asset.change;
    asset.history.push(asset.price);
    if (asset.history.length > 30) asset.history.shift();
    asset.eventAffected = false;
  };
  m.stocks.forEach(move);
  m.crypto.forEach(move);
}

function allMarketAssets() { return [...G.market.stocks, ...G.market.crypto]; }
function findMarketAsset(ticker) { return allMarketAssets().find(a => a.ticker === ticker); }
function money(v) { return v >= 1 ? "$" + Math.round(v).toLocaleString() : "$" + Number(v).toFixed(4); }
function marketPct(v) { return `${v >= 0 ? "+" : ""}${v.toFixed(1)}%`; }
function marketArrow(v) { return v > 0 ? "▲" : v < 0 ? "▼" : "—"; }
function candlesMini(a) {
  const closes = (a.history || []).slice(-7);
  if (closes.length < 2) return "";
  const W = 140, H = 36, n = closes.length, slot = W / n, bw = Math.max(5, slot * 0.55);
  const bars = closes.map((c, i) => {
    const o = i === 0 ? c : closes[i - 1];
    const wick = a.vol * c * 0.15;
    return { o, c, hi: Math.max(o, c) + wick, lo: Math.min(o, c) - wick };
  });
  let mn = Math.min(...bars.map(b => b.lo)), mx = Math.max(...bars.map(b => b.hi));
  if (!(mx > mn)) { mx = mn + 1; }
  const pad = (mx - mn) * 0.06;
  mn -= pad; mx += pad;
  const y = v => (H - 3) - ((v - mn) / (mx - mn)) * (H - 6);
  const parts = bars.map((b, i) => {
    const x = i * slot + slot / 2;
    const up = b.c >= b.o;
    const col = up ? "#30d158" : "#ff3b30";
    const yO = y(b.o), yC = y(b.c);
    const top = Math.min(yO, yC), hgt = Math.max(1.5, Math.abs(yC - yO));
    return `<line x1="${x.toFixed(1)}" y1="${y(b.hi).toFixed(1)}" x2="${x.toFixed(1)}" y2="${y(b.lo).toFixed(1)}" stroke="${col}" stroke-width="1.2"/>` +
      `<rect x="${(x - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" rx="1" fill="${col}"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${parts}</svg>`;
}
function volatilityLevel(a) { return a.vol < 0.12 ? "LOW" : a.vol < 0.25 ? "MEDIUM" : "HIGH"; }
function sentimentFor(a) {
  const h = a.history;
  const recent = h.slice(-7);
  const first = recent[0] || a.price;
  const delta = first ? (a.price - first) / first : 0;
  if (delta > 0.025) return "Bullish";
  if (delta < -0.025) return "Bearish";
  return "Neutral";
}
function primaryRiskFor(a) {
  if (a.sector === "Crypto") return "Social sentiment";
  if (a.vol >= 0.15) return "Macro";
  if (a.sector === "Tech" || a.sector === "AI") return "Earnings";
  return "Sector";
}
function riskMetrics(a) {
  const macro = a.vol >= 0.20 ? "↑↑" : a.vol >= 0.12 ? "↑" : "↓";
  const sector = a.vol >= 0.12 ? "↑" : "↓";
  const liquidity = a.volume >= 10e6 || a.sector === "Crypto" ? "↓" : "↑";
  const earnings = a.sector === "Tech" || a.sector === "AI" ? "↑↑↑" : a.vol >= 0.12 ? "↑↑" : "↑";
  const social = a.sector === "Crypto" ? (a.vol >= 0.30 ? "↑↑↑" : "↑↑") : "—";
  return { macro, sector, liquidity, earnings, social };
}
function spark(values, width) {
  const chars = "▁▂▃▄▅▆▇█";
  const vals = values.slice(-width);
  if (!vals.length) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) return chars[3].repeat(vals.length);
  return vals.map(v => chars[Math.max(0, Math.min(chars.length - 1, Math.round((v - lo) / (hi - lo) * (chars.length - 1))))]).join("");
}
function trendArrow(values) {
  let up = 0, down = 0;
  for (let i = 1; i < values.length; i++) {
    if (values[i] > values[i - 1]) up++; else if (values[i] < values[i - 1]) down++;
  }
  return up > down ? `↑↑↑ (${Math.min(3, up)}-day uptrend)` : down > up ? `↓↓↓ (${Math.min(3, down)}-day downtrend)` : "→ Neutral trend";
}
function sectorBoard() {
  const groups = {};
  allMarketAssets().forEach(a => {
    if (!groups[a.sector]) groups[a.sector] = [];
    groups[a.sector].push(a.change);
  });
  return Object.entries(groups).map(([sector, vals]) => {
    const avg = vals.reduce((s, v) => s + v, 0) / vals.length;
    const color = avg > 0 ? "#00ff41" : avg < 0 ? "#ff4444" : "#888";
    return `<div class="market-sector"><span>${sector}</span><span style="color:${color}">${marketArrow(avg)} ${marketPct(avg)}</span></div>`;
  }).join("");
}
function portfolioSummary() {
  const m = G.market;
  let invested = 0, value = 0, daily = 0;
  const exposure = {};
  const add = (a, qty) => {
    const cost = a.base * qty;
    invested += cost; value += a.price * qty; daily += (a.price - a.prev) * qty;
    exposure[a.sector] = (exposure[a.sector] || 0) + a.price * qty;
  };
  Object.entries(m.portfolio.stocks).forEach(([t,q]) => { const a=findMarketAsset(t); if(a) add(a,q); });
  Object.entries(m.portfolio.crypto).forEach(([t,q]) => { const a=findMarketAsset(t); if(a) add(a,q); });
  const pnl = value - invested;
  const stockVal = Object.entries(m.portfolio.stocks).reduce((s,[t,q]) => { const a=findMarketAsset(t); return s+(a?a.price*q:0); },0);
  const cryptoVal = value - stockVal;
  const ratio = value > 0 ? Math.round(stockVal / value * 100) : 0;
  const sectors = Object.entries(exposure).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`${s} ${Math.round(v/value*100)}%`).join(" · ") || "None";
  return { invested, value, pnl, daily, sectors, ratio, cryptoRatio: 100-ratio };
}
function treemapHoldings() {
  const out = [];
  Object.entries(G.market.portfolio.stocks || {}).forEach(([t, q]) => {
    const a = findMarketAsset(t);
    if (a && q > 0) out.push({ ticker: t, name: a.name, qty: q, value: a.price * q, change: a.change, group: "stocks" });
  });
  Object.entries(G.market.portfolio.crypto || {}).forEach(([t, q]) => {
    const a = findMarketAsset(t);
    if (a && q > 0) out.push({ ticker: t, name: a.name, qty: q, value: a.price * q, change: a.change, group: "crypto" });
  });
  return out;
}

// Flat treemap: every holding in one map. Stocks use deep green/red,
// crypto uses lighter shades of the same semantics.
function treemapShade(h) {
  const ch = Number(h.change) || 0;
  const k = 30 + Math.min(1, Math.abs(ch) / 5) * 50;
  if (h.group === "crypto") {
    if (ch > 0) return { bg: `color-mix(in srgb, #4ade80 ${k}%, transparent)`, fg: "#4ade80" };
    if (ch < 0) return { bg: `color-mix(in srgb, #fb7182 ${k}%, transparent)`, fg: "#fb7182" };
  } else {
    if (ch > 0) return { bg: `color-mix(in srgb, #16a34a ${k}%, transparent)`, fg: "#30d158" };
    if (ch < 0) return { bg: `color-mix(in srgb, #dc2626 ${k}%, transparent)`, fg: "#ff3b30" };
  }
  return { bg: `color-mix(in srgb, var(--ink) 12%, transparent)`, fg: "var(--ink2)" };
}

function treemapCell(h) {
  const ch = Number(h.change) || 0;
  const s = treemapShade(h);
  return `<div onclick="treemapOpen('${h.ticker}')" title="${h.name} · ${h.group === "crypto" ? "Crypto" : "Stock"}" style="background:${s.bg};border-radius:8px;padding:6px;font-size:10px;color:var(--ink);overflow:hidden;cursor:pointer;min-height:34px"><strong>${h.ticker}</strong><br><span style="font-size:9px">${money(h.value)} · <span style="color:${s.fg}">${ch >= 0 ? "+" : ""}${ch.toFixed(1)}%</span></span></div>`;
}

// Slice-and-dice: split by value around the half, alternate direction.
function treemapLayout(nodes, horizontal) {
  if (nodes.length === 1) return treemapCell(nodes[0]);
  const total = nodes.reduce((s, n) => s + n.value, 0) || 1;
  let acc = 0, cut = 1;
  for (let i = 0; i < nodes.length; i++) {
    acc += nodes[i].value;
    if (acc >= total / 2) { cut = i + 1; break; }
  }
  cut = Math.max(1, Math.min(nodes.length - 1, cut));
  const dir = horizontal ? "row" : "column";
  return `<div style="display:flex;flex-direction:${dir};gap:2px;flex:1;min-height:0;min-width:0">${treemapLayout(nodes.slice(0, cut), !horizontal)}${treemapLayout(nodes.slice(cut), !horizontal)}</div>`;
}

function portfolioTreemap() {
  const all = treemapHoldings().sort((a, b) => b.value - a.value);
  if (!all.length) return `<div style="color:#888;font-size:11px;padding:6px">No holdings yet — buy stocks or crypto.</div>`;
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="font-size:10px;color:var(--ink2);font-weight:700">PORTFOLIO</span><span style="font-size:9px;color:var(--ink2)"><span style="color:#30d158">■</span> stocks <span style="color:#4ade80">■</span> crypto</span></div>
    <div style="display:flex;height:190px">${treemapLayout(all, true)}</div>`;
}

function buyStock(ticker, qty) {
  const m = G.market;
  const s = m.stocks.find(x => x.ticker === ticker);
  if (!s || qty <= 0) return;
  const cost = Math.round(s.price * qty * 100) / 100;
  if (cost > G.bank) { addLog("Not enough in bank!", "bad"); renderMarket(); return; }
  G.bank -= cost;
  m.portfolio.stocks[ticker] = (m.portfolio.stocks[ticker] || 0) + qty;
  addLog(`Bought ${qty} ${ticker} @ $${s.price.toLocaleString()}`, "good");
  renderMarket();
}

function sellStock(ticker, qty) {
  const m = G.market;
  const s = m.stocks.find(x => x.ticker === ticker);
  if (!s || qty <= 0) return;
  const held = m.portfolio.stocks[ticker] || 0;
  if (qty > held) { addLog("Not enough shares!", "bad"); renderMarket(); return; }
  const revenue = Math.round(s.price * qty * 100) / 100;
  G.bank += revenue;
  m.portfolio.stocks[ticker] -= qty;
  if (m.portfolio.stocks[ticker] <= 0) delete m.portfolio.stocks[ticker];
  addLog(`Sold ${qty} ${ticker} @ $${s.price.toLocaleString()}`, "good");
  renderMarket();
}

function buyCrypto(ticker, qty) {
  const m = G.market;
  const c = m.crypto.find(x => x.ticker === ticker);
  if (!c || qty <= 0) return;
  const cost = Math.round(c.price * qty * 100) / 100;
  if (cost > G.bank) { addLog("Not enough in bank!", "bad"); renderMarket(); return; }
  G.bank -= cost;
  m.portfolio.crypto[ticker] = (m.portfolio.crypto[ticker] || 0) + qty;
  addLog(`Bought ${qty} ${ticker} @ $${c.price.toLocaleString()}`, "good");
  renderMarket();
}

function sellCrypto(ticker, qty) {
  const m = G.market;
  const c = m.crypto.find(x => x.ticker === ticker);
  if (!c || qty <= 0) return;
  const held = m.portfolio.crypto[ticker] || 0;
  if (qty > held) { addLog("Not enough coins!", "bad"); renderMarket(); return; }
  const revenue = Math.round(c.price * qty * 100) / 100;
  G.bank += revenue;
  m.portfolio.crypto[ticker] -= qty;
  if (m.portfolio.crypto[ticker] <= 0) delete m.portfolio.crypto[ticker];
  addLog(`Sold ${qty} ${ticker} @ $${c.price.toLocaleString()}`, "good");
  renderMarket();
}

function marketPortfolioValue() {
  const m = G.market;
  let val = 0;
  for (const [t, q] of Object.entries(m.portfolio.stocks || {})) {
    const s = m.stocks.find(x => x.ticker === t);
    if (s) val += s.price * q;
  }
  for (const [t, q] of Object.entries(m.portfolio.crypto || {})) {
    const c = m.crypto.find(x => x.ticker === t);
    if (c) val += c.price * q;
  }
  return Math.round(val * 100) / 100;
}

function maxTrade(mode, drugIdx) {
  if (mode === "buy") {
    const atHome = G.city === G.homeCity;
    const price = atHome ? Math.round(G.prices[drugIdx] * 0.9) : G.prices[drugIdx];
    if (!(price > 0)) return;
    const afford = Math.floor(G.cash / price);
    const space = G.maxCapacity - totalDrugs() - pocketGunCount();
    const max = Math.max(0, Math.min(afford, space));
    if (max <= 0) {
      addLog(afford <= 0 ? "Not enough cash!" : "Not enough pocket space! (guns use 1 slot each)", "bad");
      renderDrugMenu(mode);
      refreshStats();
      return;
    }
    document.getElementById("qty" + drugIdx).value = max;
  } else {
    const max = G.inventory[drugIdx] || 0;
    if (max <= 0) {
      addLog("You don't have any to sell!", "bad");
      renderDrugMenu(mode);
      refreshStats();
      return;
    }
    document.getElementById("qty" + drugIdx).value = max;
  }
  doTrade(mode, drugIdx);
}

function doTrade(mode, drugIdx) {
  const qtyInput = document.getElementById("qty" + drugIdx);
  const qty = parseInt(qtyInput.value) || 0;
  if (qty <= 0) return;

  if (mode === "buy") {
    const atHome = G.city === G.homeCity;
    const cityLocks = G.cityDrugLocks[G.city] || [];
    if (cityLocks.includes(drugIdx)) { addLog("Drug is locked in this city today!", "bad"); renderDrugMenu(mode); refreshStats(); return; }
    const price = atHome ? Math.round(G.prices[drugIdx] * 0.9) : G.prices[drugIdx];
    const cost = qty * price;
    if (cost > G.cash) { addLog("Not enough cash!", "bad"); renderDrugMenu(mode); refreshStats(); return; }
    if (totalDrugs() + pocketGunCount() + qty > G.maxCapacity) { addLog("Not enough pocket space! (guns use 1 slot each)", "bad"); renderDrugMenu(mode); refreshStats(); return; }
    G.cash -= cost;
    G.inventory[drugIdx] += qty;
    if (atHome) G.boughtToday[drugIdx] = true;
    addLog(`Bought ${qty} ${DRUGS[drugIdx].name} for $${cost.toLocaleString()}${atHome ? " (home discount)" : ""}.`, "good");
  } else {
    if (qty > G.inventory[drugIdx]) { addLog("You don't have that many!", "bad"); renderDrugMenu(mode); refreshStats(); return; }
    if (G.boughtToday[drugIdx] && G.city === G.homeCity) { addLog("Can't sell today — bought at home today!", "bad"); renderDrugMenu(mode); refreshStats(); return; }
    if (G.unsellable.includes(drugIdx)) { addLog("Can't sell today — streets are clean!", "bad"); renderDrugMenu(mode); refreshStats(); return; }
    const atHome = G.city === G.homeCity;
    const sellPrice = atHome ? Math.round(G.prices[drugIdx] * 1.1) : G.prices[drugIdx];
    const revenue = qty * sellPrice;
    G.cash += revenue;
    G.inventory[drugIdx] -= qty;
    addLog(`Sold ${qty} ${DRUGS[drugIdx].name} for $${revenue.toLocaleString()}${atHome ? " (home bonus)" : ""}.`, "good");
  }
  renderDrugMenu(mode);
  refreshStats();
}

function renderTravelMenu() {
  const c = document.getElementById("content");
  let rows = CITIES.map((city, i) => {
    const isHome = i === G.homeCity;
    const homeTag = isHome ? ' <span style="color:#4fc3f7;font-size:9px">[HOME]</span>' : '';
    if (i === G.city) {
      return `<button class="city-btn current" disabled>${city.name}${homeTag} (YOU ARE HERE)<span class="city-distance"></span></button>`;
    }
    const key = distKey(G.city, i);
    const baseDays = TRAVEL_DAYS[key];
    const reduction = G.playerCar ? G.playerCar.travelReduction : 0;
    const days = Math.max(1, Math.ceil(baseDays * (1 - reduction)));
    return `<button class="city-btn" onclick="doTravel(${i})">${city.name}${homeTag}<span class="city-distance">${days} day${days > 1 ? "s" : ""} travel</span></button>`;
  }).join("");

  c.innerHTML = `
    <div class="title">TRAVEL TO</div>
    ${rows}
    <div class="info-box">Traveling advances the clock. Plan your route wisely.</div>
    <button class="menu-btn" onclick="renderMoveHome()">MOVE HOME TO ANOTHER CITY</button>
    <button class="menu-btn back-btn" onclick="renderSafehouse()">BACK</button>`;
}

function renderMoveHome() {
  const c = document.getElementById("content");
  const rows = CITIES.map((city, i) => {
    if (i === G.homeCity) return `<button class="city-btn current" disabled>${city.name} (CURRENT HOME)</button>`;
    if (i === G.city) return `<button class="city-btn" disabled>${city.name} (YOU ARE HERE)</button>`;
    const cost = 500;
    const canAfford = G.cash >= cost;
    return `<button class="city-btn" style="${canAfford ? '' : 'opacity:0.3'}" onclick="moveHome(${i})">${city.name}<span class="city-distance">$${cost}</span></button>`;
  }).join("");

  c.innerHTML = `
    <div class="title">MOVE HOME</div>
    ${rows}
    <div class="info-box">Moving home costs $500. Home gives 10% off drug purchases.</div>
    <button class="menu-btn back-btn" onclick="renderTravelMenu()">BACK</button>`;
}

function moveHome(cityIdx) {
  const cost = 500;
  if (G.cash < cost) { addLog("Not enough cash to move!", "bad"); renderMoveHome(); return; }
  G.cash -= cost;
  G.homeCity = cityIdx;
  addLog(`Moved home to ${CITIES[cityIdx].name}. (-$${cost})`, "neutral");
  renderMoveHome();
}

function hasGun() {
  return G.guns.some(g => g.assignedTo === "player");
}

function hasStolenGun() {
  return G.guns.some(g => g.assignedTo === "player" && g.status === "stolen");
}

function hurtPlayer(n, why) {
  let remaining = n;
  if (G.armor > 0) {
    const absorbed = Math.min(G.armor, remaining);
    G.armor -= absorbed;
    remaining -= absorbed;
  }
  if (remaining > 0) G.hp = Math.max(0, G.hp - remaining);
  addLog(`You took ${n} damage (${why}).`, "bad");
  checkGameOver();
}

function policeEscapeChance() {
  const carBonus = G.playerCar ? G.playerCar.drive : 0;
  const maskBonus = G.gear.some(g => g.mask) ? 10 : 0;
  return Math.min(95, 25 + Math.min(20, G.day) + skillLevel(G.stats.driving) * 8 + carBonus + maskBonus);
}

function gunDamage() {
  const g = G.guns.find(g => g.assignedTo === "player");
  let dmg = g ? (g.damage || 0) : 0;
  if (crewHas("Goon")) dmg += 10;
  return dmg;
}

function hasDrugs() {
  return totalDrugs() > 0;
}

// Hit chance scales with both gun skills (levels): reloading climbs first
// off misses, then aiming takes over once hits start landing.
function fightHitChance() {
  const aimLv = skillLevel(G.stats.aiming);
  const relLv = skillLevel(G.stats.reloading);
  return Math.max(5, Math.min(90, 12 + aimLv * 3 + relLv * 4));
}

function randInt(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }

// Driving XP with level-up callout. Returns the log suffix.
function awardDrivingXp(n) {
  const before = skillLevel(G.stats.driving);
  G.stats.driving += n;
  const after = skillLevel(G.stats.driving);
  return `(+${n} driving XP${after > before ? ` — Driving Lv.${after}!` : ""})`;
}

// Heat: wanted from before, or shots fired in this fight → cops shoot on failed runs.
function copHeat() {
  return !!G.wanted || !!(G.police && G.police.shotsFired);
}

function applyRunDamage(dmg) {
  let remaining = dmg;
  let extra = "";
  if (G.armor > 0) {
    const ab = Math.min(G.armor, remaining);
    G.armor -= ab;
    remaining -= ab;
    extra = ` Vest absorbed ${ab}.`;
  }
  if (remaining > 0) G.hp = Math.max(0, G.hp - remaining);
  return extra;
}

// Failed-run consequence. inFight=true logs to the fight popup, else game toasts.
function copRunPunish(inFight) {
  const log = inFight ? (s => G.police.log.push(s)) : (s => addLog(s, "bad"));
  const note = inFight ? null : (s => addLog(s, "neutral"));
  if (copHeat() && Math.random() < 0.5) {
    const roll = Math.random();
    if (roll < 0.4) { (inFight ? log : note)("Cops opened fire and missed."); return; }
    if (roll < 0.7) { (inFight ? log : note)("Cops hit your car — paint damage only, you keep rolling."); return; }
    const dmg = randInt(3, 5);
    log(`Cops shot you for ${dmg} damage!${applyRunDamage(dmg)}`);
    return;
  }
  const dmg = randInt(2, 4);
  log(`Cops rammed your car for ${dmg} damage!${applyRunDamage(dmg)}`);
}

function setWanted() {
  G.wanted = 1;
  G.wantedSince = G.day;
  if (G.police && G.police.active) {
    G.police.log.push("The streets will remember this. You are WANTED.");
  } else {
    addLog("You are WANTED. Cops will be looking for you — lay low at the TRAP.", "bad");
  }
  refreshStats();
}

function clearWanted(reason) {
  if (!G.wanted) return;
  G.wanted = 0;
  if (reason === "busted") addLog("You did the time. The heat is off.", "neutral");
  else if (reason === "laylow") addLog("Kept your head down. Wanted level cleared.", "good");
  else addLog("The heat died down. You are no longer wanted.", "good");
  refreshStats();
}

function checkWantedDecay() {
  if (G.wanted && (G.day - G.wantedSince) >= 4) clearWanted("cooled");
}

function layLow() {
  if (!G.wanted) { addLog("No heat on you right now.", "neutral"); renderTrap(); return; }
  if (G.cash < 300) { addLog("Not enough cash to lay low ($300).", "bad"); renderTrap(); return; }
  G.cash -= 300;
  addLog("You lay low for 2 days...", "neutral");
  endDay();
  if (G.over) return;
  endDay();
  if (G.over) return;
  if (G.wanted) clearWanted("laylow");
  refreshStats();
  renderTrap();
}

function triggerPoliceEncounter() {
  let chance = 0.35;
  if (G.wanted) chance += 0.25;
  if (crewHas("Lookout")) chance -= 0.10;
  if (crewHas("Snitch")) chance -= 0.20;
  chance = Math.max(0.05, Math.min(0.9, chance));
  if (Math.random() > chance) return false;
  G.police = { active: true, phase: "menu", turn: 0, copHp: 30, maxCopHp: 30, log: [] };
  renderPoliceEncounter();
  return true;
}

function renderPoliceEncounter() {
  const p = G.police;
  const overlay = document.getElementById("eventOverlay");
  if (!overlay) return;
  overlay.style.display = "flex";

  let html = "";

  if (p.phase === "menu") {
    html = `
      <div style="font-size:14px;margin-bottom:8px;color:#ff4444">AH SHIT, COPS!</div>
      <div style="font-size:11px;color:#ccc;margin-bottom:12px">Be cool...</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="menu-btn" onclick="policeRun()">RUN (driving check)</button>
        ${hasDrugs() || hasStolenGun() ? `<button class="menu-btn" onclick="policePullOver()">PULL OVER</button>` : `<button class="menu-btn" onclick="policeEscapeClean()">PULL OVER (nothing illegal)</button>`}
        ${hasGun() ? `<button class="menu-btn" style="border-color:#ff4444;color:#ff4444" onclick="policeFight()">FIGHT</button>` : ""}
      </div>
      <div style="font-size:9px;color:#888;margin-top:8px">Driving skill, your car, and an escape mask help you run. New guns are legal; stolen guns are confiscated if found.</div>`;
  } else if (p.phase === "run") {
    if (p.fled) {
      html = `
        <div style="font-size:14px;margin-bottom:8px;color:#00ff41">ESCAPED!</div>
        <div style="font-size:11px;color:#ccc;margin-bottom:12px">You lost the cops. Close one.</div>
        <button class="menu-btn" onclick="closePoliceEncounter()">CONTINUE</button>`;
    } else {
      html = `
        <div style="font-size:14px;margin-bottom:8px;color:#ff4444">CAUGHT!</div>
        <div style="font-size:11px;color:#ccc;margin-bottom:12px">Couldn't shake them. Now you gotta deal with it.</div>
        <button class="menu-btn" onclick="policePullOver()">PULL OVER</button>`;
    }
  } else if (p.phase === "pullover") {
    if (!hasDrugs() && !hasStolenGun()) {
      html = `
        <div style="font-size:14px;margin-bottom:8px;color:#00ff41">CLEAN</div>
        <div style="font-size:11px;color:#ccc;margin-bottom:12px">Nothing to find. They let you go with a warning.</div>
        <button class="menu-btn" onclick="closePoliceEncounter()">CONTINUE</button>`;
    } else {
      let bustMsg = "They found everything. You're busted.";
      if (hasDrugs()) bustMsg += " All drugs confiscated.";
      if (hasStolenGun()) bustMsg += " Your stolen gun is seized.";
      const confDrugs = hasDrugs();
      const confGun = hasStolenGun();
      html = `
        <div style="font-size:14px;margin-bottom:8px;color:#ff4444">BUSTED</div>
        <div style="font-size:11px;color:#ccc;margin-bottom:12px">${bustMsg}</div>
        <button class="menu-btn" onclick="policeBust(${confDrugs},${confGun})">ACCEPT FATE</button>`;
    }
  } else if (p.phase === "fight") {
    html = renderPoliceFight();
  } else if (p.phase === "fled") {
    html = `
      <div style="font-size:14px;margin-bottom:8px;color:#00ff41">ESCAPED!</div>
      <div style="font-size:11px;color:#ccc;margin-bottom:12px">You lost them.</div>
      ${(p.log || []).map(l => `<div style="font-size:10px;color:#aaa;margin:1px 0">${l}</div>`).join("")}
      <button class="menu-btn" onclick="closePoliceEncounter()">CONTINUE</button>`;
  } else {
    // Fallback: never leave the player stuck on an empty popup.
    html = `
      <div style="font-size:14px;margin-bottom:8px;color:#00ff41">CLEAR</div>
      <div style="font-size:11px;color:#ccc;margin-bottom:12px">You slip away from the cops.</div>
      ${(p.log || []).map(l => `<div style="font-size:10px;color:#aaa;margin:1px 0">${l}</div>`).join("")}
      <button class="menu-btn" onclick="closePoliceEncounter()">CONTINUE</button>`;
  }

  overlay.innerHTML = `<div style="background:#0a0a0a;border:1px solid #00ff41;padding:12px;max-width:350px;max-height:80vh;overflow-y:auto">${html}</div>`;
}

function renderPoliceFight() {
  const p = G.police;
  const copAlive = p.copHp > 0;
  const playerAlive = G.hp > 0;
  const fled = p.phase === "fled";

  if (!copAlive) {
    return `
      <div style="font-size:14px;margin-bottom:8px;color:#00ff41">COP DOWN!</div>
      <div style="font-size:11px;color:#ccc;margin-bottom:12px">The cop is out. You speed off.</div>
      ${p.log.map(l => `<div style="font-size:10px;color:#aaa;margin:1px 0">${l}</div>`).join("")}
      <button class="menu-btn" onclick="closePoliceEncounter()">CONTINUE</button>`;
  }

  if (!playerAlive) {
    return `
      <div style="font-size:14px;margin-bottom:8px;color:#ff4444">WASTED</div>
      <div style="font-size:11px;color:#ccc;margin-bottom:12px">You went down in a blaze of glory.</div>
      ${p.log.map(l => `<div style="font-size:10px;color:#aaa;margin:1px 0">${l}</div>`).join("")}
      <button class="menu-btn" onclick="gameOver()">GAME OVER</button>`;
  }

  if (p.phase === "fled") {
    return `
      <div style="font-size:14px;margin-bottom:8px;color:#00ff41">ESCAPED!</div>
      <div style="font-size:11px;color:#ccc;margin-bottom:12px">You lost them.</div>
      ${p.log.map(l => `<div style="font-size:10px;color:#aaa;margin:1px 0">${l}</div>`).join("")}
      <button class="menu-btn" onclick="closePoliceEncounter()">CONTINUE</button>`;
  }

  const aimBonus = fightHitChance();
  const driveBonus = skillLevel(G.stats.driving) * 8;

  return `
    <div style="font-size:14px;margin-bottom:8px;color:#ff4444">FIREFIGHT!</div>
    <div style="font-size:11px;color:#ccc;margin-bottom:4px">Turn ${p.turn + 1}</div>
    <div style="font-size:10px;color:#888;margin-bottom:8px">You: ${G.hp}/${G.maxHp} HP | Cop: ${p.copHp}/${p.maxCopHp} HP</div>
    <div style="max-height:80px;overflow-y:auto;margin-bottom:8px">
      ${p.log.map(l => `<div style="font-size:10px;color:#aaa;margin:1px 0">${l}</div>`).join("")}
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button class="menu-btn" onclick="policeFightTurn('shoot')">SHOOT (aim: ${aimBonus}%)</button>
      <button class="menu-btn" onclick="policeFightTurn('ram')">RAM COP (drive: ${driveBonus}%)</button>
      <button class="menu-btn" onclick="policeFightTurn('flee')">FLEE (drive: ${driveBonus}%)</button>
    </div>`;
}

function policeFightTurn(action) {
  const p = G.police;
  const aimBonus = fightHitChance();
  const driveBonus = skillLevel(G.stats.driving) * 8;
  const dmg = gunDamage();
  const turnNum = p.turn + 1;

  // Cop calls off after 6 turns — escaping a fight puts heat on you.
  if (turnNum >= 6) {
    p.log.push(`Turn ${turnNum}: Cop radioed for backup. Aborting pursuit.`);
    p.phase = "fled";
    setWanted();
    renderPoliceEncounter();
    return;
  }

  // Player action — hits train aiming, misses train reloading (faster reloads = steadier aim).
  if (action === "shoot") {
    p.shotsFired = true;
    if (Math.random() * 100 < aimBonus) {
      p.copHp -= dmg;
      const before = skillLevel(G.stats.aiming);
      G.stats.aiming += 1;
      const after = skillLevel(G.stats.aiming);
      p.log.push(`Turn ${turnNum}: You hit the cop for ${dmg} damage! (+1 aiming XP${after > before ? ` — Aiming Lv.${after}!` : ""})`);
      if (p.copHp <= 0) setWanted();
    } else {
      const before = skillLevel(G.stats.reloading);
      G.stats.reloading += 1;
      const after = skillLevel(G.stats.reloading);
      p.log.push(`Turn ${turnNum}: You missed. (+1 reloading XP${after > before ? ` — Reloading Lv.${after}!` : ""})`);
    }
  } else if (action === "ram") {
    if (Math.random() * 100 < driveBonus) {
      const ramDmg = 10 + G.stats.strength * 2;
      p.copHp -= ramDmg;
      p.log.push(`Turn ${turnNum}: You rammed the cop car for ${ramDmg} damage!`);
    } else {
      p.log.push(`Turn ${turnNum}: Bad angle. No damage.`);
    }
  } else if (action === "flee") {
    if (Math.random() * 100 < driveBonus) {
      p.phase = "fled";
      p.log.push(`Turn ${turnNum}: You shook them off! ${awardDrivingXp(2)}`);
      setWanted();
      renderPoliceEncounter();
      return;
    } else {
      p.log.push(`Turn ${turnNum}: Couldn't escape. ${awardDrivingXp(1)}`);
      copRunPunish(true);
      p.turn++;
      renderPoliceEncounter();
      return;
    }
  }

  // Cop shoots back
  if (p.copHp > 0) {
    const copAccuracy = 30 + turnNum * 3;
    const copDmg = 5 + Math.floor(Math.random() * 5);
    if (Math.random() * 100 < copAccuracy) {
      let remaining = copDmg;
      let msg = `Turn ${turnNum}: Cop shot you for ${copDmg} damage!`;
      if (G.armor > 0) {
        const absorbed = Math.min(G.armor, remaining);
        G.armor -= absorbed;
        remaining -= absorbed;
        msg += ` Vest absorbed ${absorbed}.`;
      }
      if (remaining > 0) G.hp -= remaining;
      p.log.push(msg);
    } else {
      p.log.push(`Turn ${turnNum}: Cop missed you.`);
    }
    G.hp = Math.max(0, G.hp);
  }

  p.turn++;
  renderPoliceEncounter();
}

function policeRun() {
  G.police.phase = "run";
  G.police.fled = Math.random() * 100 < policeEscapeChance();
  if (G.police.fled) {
    addLog(`Clean getaway! ${awardDrivingXp(2)}`, "good");
  } else {
    addLog(`Couldn't shake them. ${awardDrivingXp(1)}`, "neutral");
    copRunPunish(false);
    if (G.over) { render(); return; }
  }
  renderPoliceEncounter();
}

function policePullOver() {
  G.police.phase = "pullover";
  renderPoliceEncounter();
}

function policeEscapeClean() {
  addLog("Cops let you go. Nothing to see here.", "good");
  closePoliceEncounter();
}

function policeBust(confDrugs, confGun) {
  if (confDrugs) {
    G.inventory = new Array(DRUGS.length).fill(0);
    addLog("All drugs confiscated by police!", "bad");
  }
  if (confGun) {
    const playerGun = G.guns.find(g => g.assignedTo === "player" && g.status === "stolen");
    if (playerGun) {
      playerGun.assignedTo = "seized";
      syncGunGear();
      addLog(`${playerGun.name} seized by police!`, "bad");
    }
  }
  hurtPlayer(5, "worked over during the arrest");
  G.police.busted = true;
  if (G.wanted) { G.wanted = 0; addLog("You did the time. The heat is off.", "neutral"); }
  closePoliceEncounter();
}

function policeFight() {
  G.police.phase = "fight";
  renderPoliceEncounter();
}

function closePoliceEncounter() {
  const dest = G.pendingTravel;
  G.pendingTravel = null;
  const busted = !!(G.police && G.police.busted);
  G.police = { active: false, phase: "menu", turn: 0, copHp: 30, maxCopHp: 30, log: [] };
  const overlay = document.getElementById("eventOverlay");
  if (overlay) overlay.style.display = "none";
  if (dest != null && !busted && !G.over) {
    addLog(`Shook the cops and made it to ${CITIES[dest].name}.`, "good");
    completeTravel(dest);
    return;
  }
  checkGameOver();
  render();
}

function triggerMarketAssetEvent() {
  if (Math.random() > 0.15) return;
  const assets = allMarketAssets();
  const a = assets[Math.floor(Math.random() * assets.length)];
  const old = a.price;
  const direction = Math.random() < 0.5 ? -1 : 1;
  const pct = 0.05 + Math.random() * 0.15;
  a.prev = a.price;
  a.price = Math.max(a.base >= 1 ? 1 : 0.01, +(a.price * (1 + direction * pct)).toFixed(a.base >= 1 ? 0 : 4));
  a.change = a.prev > 0 ? ((a.price - a.prev) / a.prev * 100) : 0;
  a.lastDayChange = a.change;
  a.history.push(a.price);
  if (a.history.length > 30) a.history.shift();
  a.eventAffected = true;
}

function doTravel(cityIdx) {
  G.pendingTravel = cityIdx;
  if (triggerPoliceEncounter()) return;
  G.pendingTravel = null;
  completeTravel(cityIdx);
}

function completeTravel(cityIdx) {
  const key = distKey(G.city, cityIdx);
  const baseDays = TRAVEL_DAYS[key];
  const reduction = G.playerCar ? G.playerCar.travelReduction : 0;
  const days = Math.max(1, Math.ceil(baseDays * (1 - reduction)));
  advanceDate(days);
  checkWantedDecay();
  tickDeployments(days);
  G.battery = batteryMax();
  G.city = cityIdx;
  addLog(`Traveled to ${CITIES[cityIdx].name} (+${days} day${days > 1 ? "s" : ""}).`, "neutral");
  randomizePrices();
  for (let i = 0; i < days; i++) updateMarket();
  triggerMarketAssetEvent();
  triggerRandomEvent();
  checkLoanDeadline();
  checkGameOver();
  render();
}

function renderInventory() {
  const c = document.getElementById("content");
  const hasHQ = G.hq !== "";
  let rows = DRUGS.map((d, i) => {
    const qty = G.inventory[i];
    const hqQty = hasHQ ? G.hqInventory[i] : 0;
    const value = qty * G.prices[i];
    return `<div class="drug-row">
      <span class="drug-name">${d.name}</span>
      <span class="drug-owned">x${qty}</span>
      ${hasHQ ? `<span style="font-size:9px;color:#4fc3f7">HQ: x${hqQty}</span>` : ""}
      <span class="drug-price">~$${value.toLocaleString()}</span>
      ${hasHQ && qty > 0 ? `<button class="menu-btn" style="width:auto;padding:2px 6px;margin:0;font-size:9px" onclick="moveDrugToHQ(${i})">STORE</button>` : ""}
      ${hasHQ && hqQty > 0 ? `<button class="menu-btn" style="width:auto;padding:2px 6px;margin:0;font-size:9px" onclick="retrieveDrugFromHQ(${i})">GRAB</button>` : ""}
    </div>`;
  }).join("");

  c.innerHTML = `
    <div class="title">INVENTORY</div>
    ${rows}
    <div class="info-box">
      Pockets: ${totalDrugs() + pocketGunCount()}/${G.maxCapacity} (${pocketGunCount()} gun${pocketGunCount() === 1 ? "" : "s"})<br>
      ${hasHQ ? `HQ (${G.hq}): ${hqUsedSlots()}/${hqCapacity()} (${gunHQCount()} gun${gunHQCount() === 1 ? "" : "s"})<br>` : ""}
      Estimated value: ~$${DRUGS.reduce((s, d, i) => s + G.inventory[i] * G.prices[i], 0).toLocaleString()}
    </div>
    <button class="menu-btn back-btn" onclick="renderSafehouse()">BACK</button>`;
}

function totalHQDrugs() {
  return G.hqInventory.reduce((s, q) => s + q, 0);
}

function moveDrugToHQ(idx) {
  if (!G.hq) return;
  const qty = G.inventory[idx];
  if (qty <= 0) return;
  const hqCap = G.hq ? hqCapacity() : G.maxCapacity;
  const hqSpace = hqCap - (G.hq ? hqUsedSlots() : totalHQDrugs() + gunHQCount());
  const move = Math.min(qty, hqSpace);
  if (move <= 0) { addLog("HQ is full!", "bad"); renderInventory(); return; }
  G.inventory[idx] -= move;
  G.hqInventory[idx] += move;
  addLog(`Stored ${move} ${DRUGS[idx].name} in HQ.`, "good");
  renderInventory();
}

function retrieveDrugFromHQ(idx) {
  if (!G.hq) return;
  const qty = G.hqInventory[idx];
  if (qty <= 0) return;
  const pocketSpace = G.maxCapacity - totalDrugs() - pocketGunCount();
  const grab = Math.min(qty, pocketSpace);
  if (grab <= 0) { addLog("Pockets are full!", "bad"); renderInventory(); return; }
  G.hqInventory[idx] -= grab;
  G.inventory[idx] += grab;
  addLog(`Grabbed ${grab} ${DRUGS[idx].name} from HQ.`, "good");
  renderInventory();
}

function refreshStats() {
  const app = document.getElementById("app");
  const statsBar = app.querySelector('.stats-bar');
  if (!statsBar) return;
  statsBar.innerHTML = `
    <div class="srow1">
      <span class="cash">$${G.cash.toLocaleString()}</span>
      <span style="display:flex;flex-direction:column;align-items:center;line-height:1.2">${G.debt > 0 ? `<span class="debt" onclick="goLoan()" title="Loan shark">DEBT $${G.debt.toLocaleString()}</span>` : ""}${G.wanted ? `<span class="wanted-tag" title="Cops are looking for you — lay low at the TRAP">&#9679; WANTED</span>` : ""}${(!G.wanted && G.debt <= 0) ? "<span></span>" : ""}</span>
      <span class="day" onclick="sleepPopup()" title="Sleep">Day ${String(G.day).padStart(2, "0")}</span>
    </div>
    <div class="srow2">
      <span class="bank" onclick="goBank()" title="Bank">$${G.bank.toLocaleString()}</span>
      <span class="pock" onclick="goInv()" title="Inventory">🎒 ${totalDrugs()}/${G.maxCapacity}</span>
    </div>`;
  if(window.phoneDate)window.phoneDate();
  updateBatteryUI();
  applyPhoneSkin();
}

function doBank(mode) {
  if (mode === "deposit") {
    const amt = parseInt(document.getElementById("bankDep").value) || 0;
    if (amt <= 0 || amt > G.cash) { addLog("Invalid amount.", "bad"); renderMarket(); return; }
    G.cash -= amt;
    G.bank += amt;
    addLog(`Deposited $${amt.toLocaleString()} in bank.`, "good");
  } else if (mode === "depositAll") {
    if (G.cash <= 0) return;
    G.bank += G.cash;
    addLog(`Deposited $${G.cash.toLocaleString()} in bank.`, "good");
    G.cash = 0;
  } else if (mode === "withdraw") {
    const amt = parseInt(document.getElementById("bankWit").value) || 0;
    if (amt <= 0 || amt > G.bank) { addLog("Invalid amount.", "bad"); renderMarket(); return; }
    G.bank -= amt;
    G.cash += amt;
    addLog(`Withdrew $${amt.toLocaleString()} from bank.`, "good");
  } else if (mode === "withdrawAll") {
    if (G.bank <= 0) return;
    G.cash += G.bank;
    addLog(`Withdrew $${G.bank.toLocaleString()} from bank.`, "good");
    G.bank = 0;
  }
  renderMarket();
}

/* ── stats-bar shortcuts + sleep popup ── */
function goBank(){ if(G.market) G.market._tab = "bank"; goTab("market"); }
function goLoan(){ G.tab = "trap"; render(); renderLoanShark(); }
function goInv(){ G.tab = "safehouse"; render(); renderInventory(); }
function hideOverlay(){ const o = document.getElementById("eventOverlay"); if(o) o.style.display = "none"; }
function sleepPopup(){
  const o = document.getElementById("eventOverlay");
  if(!o) return;
  o.style.display = "flex";
  o.innerHTML = `<div style="background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border:.5px solid var(--line);border-radius:22px;padding:18px;width:100%;color:var(--ink);text-align:center">
    <div style="font-size:15px;font-weight:700;margin-bottom:6px">Sleep until tomorrow?</div>
    <div style="font-size:12px;color:var(--ink2);margin-bottom:12px">+1 day · interest ticks · shops restock${G.hp < G.maxHp ? " · you are hurt" : ""}</div>
    <button class="menu-btn" onclick="hideOverlay();endDay()">SLEEP</button>
    ${G.hp < G.maxHp ? `<button class="menu-btn" onclick="hideOverlay();startHeal()">HEAL (sleep + heal)</button>` : ""}
    <button class="menu-btn" onclick="hideOverlay()">CANCEL</button>
  </div>`;
}

function renderLoanShark() {
  const c = document.getElementById("content");
  const interest = Math.round(G.debt * 0.10);
  c.innerHTML = `
    <div class="title">LOAN SHARK</div>
    <div class="info-box" style="border-color:#ff4444">
      <span style="color:#ff4444">You owe: $${G.debt.toLocaleString()}</span><br>
      Interest: 10% per day (+$${interest.toLocaleString()})<br>
      Pay it off fast!
    </div>
    <div class="bank-row">
      <span style="min-width:70px">Pay:</span>
      <input class="drug-input" type="number" min="0" id="loanPay" style="width:120px" placeholder="Amount">
      <button class="menu-btn" style="width:auto;padding:4px 12px" onclick="doLoanPay()">PAY</button>
      <button class="menu-btn" style="width:auto;padding:4px 12px" onclick="doLoanPayAll()">PAY ALL</button>
    </div>
    <div class="info-box">Cash: $${G.cash.toLocaleString()}<br><span style="color:#ff4444;font-size:10px">Loan shark only accepts cash. Withdraw from bank first.</span></div>
    <button class="menu-btn back-btn" onclick="renderTrap()">BACK</button>`;
}

function checkCrewUnlock() {
  if (G.debt > 0 || G.crewMsgSent) return;
  G.crewMsgSent = true;
  sendMessage("Loan Shark", "now that you debt free time to get your wings, cant do it alone to be a big dog, get you some members", { story: true });
}

function doLoanPayAll() {
  const amt = Math.min(G.cash, G.debt);
  if (amt <= 0) { addLog("No cash to pay!", "bad"); renderLoanShark(); refreshStats(); return; }
  G.cash -= amt;
  G.debt -= amt;
  if (G.debt <= 0) {
    G.debt = 0;
    addLog("DEBT PAID OFF! Loan shark is happy.", "good");
    checkCrewUnlock();
  } else {
    addLog(`Paid $${amt.toLocaleString()} toward debt.`, "good");
  }
  render();
}

function doLoanPay() {
  const amt = parseInt(document.getElementById("loanPay").value) || 0;
  if (amt <= 0 || amt > G.cash) { addLog("Invalid amount.", "bad"); renderLoanShark(); refreshStats(); return; }
  G.cash -= amt;
  G.debt -= amt;
  if (G.debt <= 0) {
    G.debt = 0;
    addLog("DEBT PAID OFF! Loan shark is happy.", "good");
    checkCrewUnlock();
  } else {
    addLog(`Paid $${amt.toLocaleString()} toward debt.`, "good");
  }
  render();
}

/* unified display levels 1-10: each level costs more XP than the last (triangular) */
const SKILL_STEPS = [0, 5, 15, 30, 50, 75, 105, 140, 180, 225];
function skillLevel(xp) {
  xp = Math.max(0, xp || 0);
  let lv = 1;
  for (let i = 0; i < SKILL_STEPS.length; i++) { if (xp >= SKILL_STEPS[i]) lv = i + 1; }
  return Math.min(10, lv);
}
function skillNext(xp) {
  xp = Math.max(0, xp || 0);
  for (const s of SKILL_STEPS) { if (s > xp) return s; }
  return null;
}
function skillNodes(lv) {
  let s = "";
  for (let i = 1; i <= 10; i++) s += `<i class="node${i <= lv ? " on" : ""}"></i>`;
  return s;
}

function firstaidLevel() {
  const xp = G.firstaidXp;
  if (xp >= 200) return 5;
  if (xp >= 100) return 4;
  if (xp >= 50) return 3;
  if (xp >= 20) return 2;
  if (xp >= 5) return 1;
  return 0;
}

function firstaidHealAmount() {
  const level = firstaidLevel();
  return 5 + level * 3; // 5 at lvl0, 8 at lvl1, 11 at lvl2, 14 at lvl3, 17 at lvl4, 20 at lvl5
}

function startHeal() {
  if (G.hp >= G.maxHp) return;
  G.healing = 1;
  addLog("You rest for the day...", "neutral");
  endDay();
}

function processHealingTick() {
  if (G.healing > 0 && G.hp < G.maxHp) {
    const heal = firstaidHealAmount();
    G.hp = Math.min(G.maxHp, G.hp + heal);
    G.healing = 0;
    G.firstaidXp += 1;
    const lvl = firstaidLevel();
    addLog(`Rested and healed +${heal} HP (${G.hp}/${G.maxHp}). First Aid XP: ${G.firstaidXp} (Lv.${lvl})`, "good");
  }
}

function endDay() {
  advanceDate(1);
  checkWantedDecay();
  tickDeployments(1);
  rollJobBoard();
  if ((G.battery == null ? batteryMax() : G.battery) < batteryMax()) addLog("Phone recharged overnight.", "neutral");
  G.battery = batteryMax();
  rollTrunkStock();
  rollLotStock();
  updateVirusStatus();
  processHealingTick();
  if (crewHas("Medic") && G.hp < G.maxHp) {
    G.hp = Math.min(G.maxHp, G.hp + 10);
    addLog("Medic patched you up +10 HP.", "good");
  }
  G.boughtToday = new Array(DRUGS.length).fill(false);
  // Daily effects only last one day: clean streets, city locks, event sales.
  G.unsellable = [];
  G.cityDrugLocks = {};
  G.eventDiscounts = {};
  // interest on bank
  if (G.bank > 0) {
    const int = Math.round(G.bank * 0.05);
    G.bank += int;
    if (int > 0) addLog(`Bank interest: +$${int.toLocaleString()}`, "good");
  }
  // interest on debt
  if (G.debt > 0) {
    const interest = Math.round(G.debt * 0.10);
    G.debt += interest;
    addLog(`Loan shark interest: +$${interest.toLocaleString()}`, "bad");
  }
  randomizePrices();
  updateMarket();
  triggerMarketAssetEvent();
  triggerRandomEvent();
  checkLoanDeadline();
  checkGameOver();
  render();
}

// Day-29 warning DM, day-30 collection. Fires on any day tick (sleep/heal/travel).
function checkLoanDeadline() {
  if (G.debt <= 0 || G.over) return;
  if (!G.sharkWarned && G.day >= 29) {
    G.sharkWarned = true;
    sendMessage("Loan Shark", "you have 24 hours", { story: true });
  }
  if (!G.sharkHit && G.day >= 30) {
    G.sharkHit = true;
    const taken = G.cash;
    G.cash = 0;
    G.debt = Math.max(0, G.debt - taken);
    G.hp = Math.max(0, G.hp - 50);
    if (G.debt <= 0) addLog(`The stranger took $${taken.toLocaleString()} — debt settled in blood.`, "neutral");
    else addLog(`The stranger took $${taken.toLocaleString()}. You still owe $${G.debt.toLocaleString()}.`, "bad");
    checkCrewUnlock();
    refreshStats();
    addEventOverlay("COLLECTION DAY", "a stranger was waiting for you outside your door he broke your leg cleanly and ran your pockets", "bad");
  }
}

function triggerTravelEvent() {
  if (G.police && G.police.active) return;
  if (Math.random() > 0.40) return;
  if (Math.random() < 0.25) {
    triggerRareEvent();
  } else {
    triggerMarketEvent();
  }
}

function formatDrugChange(name, oldPrice, newPrice) {
  const delta = oldPrice > 0 ? Math.round(((newPrice - oldPrice) / oldPrice) * 100) : 0;
  const sign = delta > 0 ? "+" : "";
  return `<span style="color:#ff9800;font-weight:bold">${name} ${sign}${delta}%</span>`;
}

function triggerMarketEvent() {
  const drugIdx = Math.floor(Math.random() * DRUGS.length);
  const d = DRUGS[drugIdx];
  const variant = Math.floor(Math.random() * 4);

  if (variant === 0) {
    const oldPrice = G.prices[drugIdx];
    const drop = Math.round(d.base * (0.4 + Math.random() * 0.3));
    G.prices[drugIdx] = Math.max(d.min, drop);
    addEventOverlay(`${d.name} FLOOD`, `${formatDrugChange(d.name, oldPrice, G.prices[drugIdx])} — prices dropped to $${G.prices[drugIdx].toLocaleString()}.`, "good");
  } else if (variant === 1) {
    const oldPrice = G.prices[drugIdx];
    const rise = Math.round(d.base * (1.5 + Math.random() * 1.0));
    G.prices[drugIdx] = Math.min(d.max, rise);
    addEventOverlay(`DRY MARKET`, `${formatDrugChange(d.name, oldPrice, G.prices[drugIdx])} — prices rose to $${G.prices[drugIdx].toLocaleString()}.`, "bad");
  } else if (variant === 2) {
    const changes = [];
    for (let i = 0; i < DRUGS.length; i++) {
      const oldPrice = G.prices[i];
      const bump = Math.round(G.prices[i] * (1.3 + Math.random() * 0.5));
      G.prices[i] = Math.min(DRUGS[i].max, bump);
      changes.push(formatDrugChange(DRUGS[i].name, oldPrice, G.prices[i]));
    }
    addEventOverlay("HEAT WAVE", `Drug prices jumped: ${changes.join(" &nbsp; ")}`, "bad");
  } else {
    const changes = [];
    for (let i = 0; i < DRUGS.length; i++) {
      const oldPrice = G.prices[i];
      const drop = Math.round(G.prices[i] * (0.3 + Math.random() * 0.3));
      G.prices[i] = Math.max(DRUGS[i].min, drop);
      changes.push(formatDrugChange(DRUGS[i].name, oldPrice, G.prices[i]));
    }
    addEventOverlay("NEW LAWS", `Drug prices dropped: ${changes.join(" &nbsp; ")}`, "good");
  }
}
function triggerRareEvent() {
  const variant = Math.floor(Math.random() * 5);

  if (variant === 0) {
    addEventOverlay("GANGBUST", "Rico has left a bid for power. HQ prices 25% off today.", "good");
    G.eventDiscounts = { ...G.eventDiscounts, hq: 0.25 };
  } else if (variant === 1) {
    addEventOverlay("PRISON REFORM", "Prison reform releases criminals into society. Crew members 50% off.", "good");
    G.eventDiscounts = { ...G.eventDiscounts, crew: 0.50 };
  } else if (variant === 2) {
    addEventOverlay("GUN STORE ROBBED", "Gun store robbed at gunpoint! Trunk prices 40% off today.", "good");
    G.eventDiscounts = { ...G.eventDiscounts, trunk: 0.40 };
  } else if (variant === 3) {
    const idx = Math.floor(Math.random() * DRUGS.length);
    const city = G.city;
    if (!G.cityDrugLocks[city]) G.cityDrugLocks[city] = [];
    G.cityDrugLocks[city].push(idx);
    addEventOverlay("HUGE BUST", `A huge bust wiped ${DRUGS[idx].name} off the streets. Can't buy it here today.`, "bad");
  } else {
    const locked = [];
    while (locked.length < 4) {
      const r = Math.floor(Math.random() * DRUGS.length);
      if (!locked.includes(r)) locked.push(r);
    }
    G.unsellable = locked;
    for (const i of locked) {
      const drop = Math.round(G.prices[i] * 0.8);
      G.prices[i] = Math.max(DRUGS[i].min, drop);
    }
    const names = locked.map(i => DRUGS[i].name).join(", ");
    addEventOverlay("CAMPS CLEANED", `Homeless camps cleaned up. Can't sell ${names} today — prices 20% off.`, "neutral");
  }
}

function addEventOverlay(title, msg, type) {
  const overlay = document.getElementById("eventOverlay");
  if (!overlay) return;
  const color = type === "good" ? "#00ff41" : type === "bad" ? "#ff4444" : "#ffcc00";
  overlay.style.display = "flex";
  overlay.innerHTML = `<div style="background:#0a0a0a;border:1px solid ${color};padding:12px;max-width:350px;text-align:center">
    <div style="font-size:14px;margin-bottom:8px;color:${color}">${title}</div>
    <div style="font-size:11px;color:#ccc;margin-bottom:12px">${msg}</div>
    <button class="menu-btn" onclick="closeEventOverlay()">CONTINUE</button>
  </div>`;
}

function closeEventOverlay() {
  const overlay = document.getElementById("eventOverlay");
  if (overlay) overlay.style.display = "none";
  render();
}

function triggerRandomEvent() {
  triggerTravelEvent();
}

function checkGameOver() {
  if (G.hp <= 0) {
    G.over = true;
  }
}

function renderGameOver(app) {
  const nw = netWorth();
  let rank = "";
  if (nw >= 50000) rank = "Drug Lord";
  else if (nw >= 25000) rank = "Kingpin";
  else if (nw >= 10000) rank = "Dealer";
  else if (nw >= 0) rank = "Small Timer";
  else rank = "Dead Broke";

  app.innerHTML = `
    <div class="header">
      <h1>GAME OVER</h1>
      <div class="stats-bar"><span>${getDateString()}</span></div>
    </div>
    <div class="info-box">
      <strong>FINAL RESULTS</strong><br><br>
      Cash: $${G.cash.toLocaleString()}<br>
      Bank: $${G.bank.toLocaleString()}<br>
      Debt: $${G.debt.toLocaleString()}<br>
      Inventory Value: ~$${DRUGS.reduce((s, d, i) => s + G.inventory[i] * G.prices[i], 0).toLocaleString()}<br><br>
      <strong>NET WORTH: $${nw.toLocaleString()}</strong><br>
      Rank: <strong>${rank}</strong>
    </div>
    <button class="menu-btn" onclick="initGame(); render();">NEW GAME</button>`;
}

initGame();
render();

setInterval(scanTick, 100);
</script>
