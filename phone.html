<style>
@import url('https://fonts.googleapis.com/css2?family=Pirata+One&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ios-bg:#ffffff;
  --ios-bg-2:#f2f2f7;
  --ios-ink:#000000;
  --ios-ink-2:#8a8a8e;
  --ios-line:#d4d4d9;
  --ios-accent:#007aff;
  --ios-accent-ink:#ffffff;

  --bg:var(--ios-bg);
  --bg2:var(--ios-bg-2);
  --ink:var(--ios-ink);
  --ink2:var(--ios-ink-2);
  --line:var(--ios-line);
  --accent:var(--ios-accent);
  --accent-ink:var(--ios-accent-ink);
  --glow:0 0 0 rgba(0,0,0,0);

  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --display:"Pirata One",serif;

  --spring:cubic-bezier(.19,1.42,.38,1);
  --ease:cubic-bezier(.32,.72,0,1);
}

/* the crypt takeover */
.screen.spooked{
  --bg:#06090a;
  --bg2:#0c1412;
  --ink:#e8ffe4;
  --ink2:#5f8a6d;
  --line:#173226;
  --accent:#7cff4f;
  --accent-ink:#04150a;
  --glow:0 0 22px rgba(124,255,79,.35);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}

/* MODULE: transparent page so the phone composites inside the main game
   as the smaller player's device (embed via iframe). No backdrop, no grain. */
body{
  font-family:var(--sys);
  background:transparent;
  display:grid;
  place-items:center;
  padding:0;
  margin:0;
  overflow:hidden;
}

/* ── bat exodus (fired at the end) ──────────────────────── */
.burst-layer{position:fixed;inset:0;z-index:150;pointer-events:none;overflow:hidden}
.burstbat{
  position:fixed;width:34px;margin-left:-17px;margin-top:-12px;
  color:#0d0a12;filter:drop-shadow(0 0 10px rgba(124,255,79,.6));
  will-change:transform,opacity;
}
.burstbat svg{display:block;animation:flap .18s ease-in-out infinite alternate}

/* ── ambient bats (only after corruption) ───────────────── */
.bats{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity 1.2s ease}
body.haunted .bats{opacity:.5}
.bat{position:absolute;width:26px;color:#2a1b3d;animation:flit linear infinite;will-change:transform}
.bat svg{display:block;animation:flap .32s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(.55) scaleX(1.05)}to{transform:scaleY(1.15) scaleX(.9)}}
@keyframes flit{
  0%{transform:translate(-12vw,18vh) rotate(-6deg)}
  50%{transform:translate(52vw,-14vh) rotate(8deg)}
  100%{transform:translate(114vw,26vh) rotate(-4deg)}
}

/* ── stage / phone shell ────────────────────────────────── */
.stage{
  position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:34px;
  perspective:1700px;perspective-origin:50% 42%;
  /* Static shadow lives here (never animated) so the floating phone
     animation below only moves a finished picture. */
  filter:drop-shadow(-38px 46px 46px rgba(0,0,0,.62));
}

/* the 15° left / 10° up rig — quake stays on .phone so the tilt survives */
.tilt3d{
  --tiltY:-15deg;--tiltX:10deg;
  transform-style:preserve-3d;
  transform:rotateX(var(--tiltX)) rotateY(var(--tiltY));
  transition:transform 1.1s var(--ease);
  animation:hover3d 9s ease-in-out infinite;
}
@keyframes hover3d{
  0%,100%{transform:rotateX(var(--tiltX)) rotateY(var(--tiltY)) translateY(0)}
  50%{transform:rotateX(calc(var(--tiltX) - 1.6deg)) rotateY(calc(var(--tiltY) + 2deg)) translateY(-9px)}
}
body.haunted .tilt3d{--tiltY:-17deg;--tiltX:12deg}
body.nofloat .tilt3d{animation:none}

.phone{
  position:relative;width:392px;height:812px;border-radius:58px;
  padding:11px;
  background:linear-gradient(160deg,#4a4a52,#17171b 30%,#2c2c33 55%,#0e0e11 78%,#3d3d45);
  box-shadow:
    0 2px 0 rgba(255,255,255,.14) inset,
    0 50px 90px -30px rgba(0,0,0,.9),
    0 0 0 1px #000;
  transition:box-shadow .9s ease, transform .5s var(--ease);
}
body.haunted .phone{
  box-shadow:
    0 2px 0 rgba(255,255,255,.1) inset,
    0 50px 90px -28px rgba(0,0,0,.95),
    0 0 0 1px #000,
    0 0 90px -10px rgba(124,255,79,.35);
}
/* ══ HIGH-TECH PHONE SKIN — titanium frame + banded glass (crossfade) ══ */
.phone-frame-hi{
  position:absolute;inset:0;border-radius:58px;pointer-events:none;
  background:
    linear-gradient(to bottom,rgba(255,255,255,.28),rgba(255,255,255,0) 4%),
    linear-gradient(160deg,#0b0c0e,#3a3f47 28%,#101216 52%,#6e7480 76%,#050607);
  box-shadow:
    0 2px 0 rgba(255,255,255,.35) inset,
    0 50px 90px -30px rgba(0,0,0,.9),
    0 0 0 1px #000,
    0 0 44px -6px rgba(140,170,255,.35);
  opacity:0;transition:opacity .8s ease;
}
.phone-frame-hi::before{ /* antenna breaks */
  content:"";position:absolute;top:5px;left:0;width:100%;height:6px;
  background:
    linear-gradient(#9aa0ab,#9aa0ab) 15% 0/3px 6px no-repeat,
    linear-gradient(#9aa0ab,#9aa0ab) 85% 0/3px 6px no-repeat;
  opacity:.8;
}
.phone-frame-hi::after{ /* side buttons */
  content:"";position:absolute;right:-3px;top:200px;width:3px;height:190px;
  background:linear-gradient(to bottom,#3a3f47 0 50px,transparent 50px 92px,#3a3f47 92px 190px);
  border-radius:0 3px 3px 0;
}
.screen-glare-hi{
  position:absolute;inset:0;border-radius:48px;pointer-events:none;z-index:60;
  background:linear-gradient(to right,rgba(255,255,255,.20) 1%,transparent 5%,rgba(255,255,255,.10) 50%,transparent 97%,rgba(255,255,255,.20) 99%);
  mix-blend-mode:screen;opacity:0;transition:opacity .8s ease;
}
body.skin-high .phone-frame-hi,body.skin-high .screen-glare-hi{opacity:1}
.phone.quake{animation:quake .5s ease}
@keyframes quake{
  0%,100%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(-4px,2px) rotate(-.35deg)}
  40%{transform:translate(5px,-3px) rotate(.4deg)}
  60%{transform:translate(-3px,-1px) rotate(-.25deg)}
  80%{transform:translate(3px,2px) rotate(.15deg)}
}

.screen{
  position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;
  background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;
  transition:background .8s var(--ease), color .8s var(--ease);
}
.screen::after{ /* glass glare */
  content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
  background:linear-gradient(118deg,rgba(255,255,255,.11) 0 18%,transparent 34%);
  mix-blend-mode:screen;
}
.screen.spooked::before{ /* vignette + fog */
  content:"";position:absolute;inset:0;pointer-events:none;z-index:55;
  background:
    radial-gradient(120% 70% at 50% 0%,rgba(124,255,79,.10),transparent 55%),
    radial-gradient(100% 60% at 50% 100%,rgba(177,75,255,.14),transparent 60%),
    radial-gradient(140% 100% at 50% 50%,transparent 45%,rgba(0,0,0,.85));
  animation:fogIn 1.4s var(--ease) both;
}
@keyframes fogIn{from{opacity:0}to{opacity:1}}

.island{
  position:absolute;top:22px;left:50%;transform:translateX(-50%);
  width:118px;height:33px;border-radius:20px;background:#000;z-index:70;
  transition:width .5s var(--spring), background .6s ease;
}
.phone.alarmed .island{width:172px;background:#000;box-shadow:0 0 26px rgba(124,255,79,.5)}

/* ── status bar ─────────────────────────────────────────── */
.statusbar{
  height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;
  padding:14px 30px 0;font-size:15px;font-weight:600;letter-spacing:.2px;position:relative;z-index:40;
}
.statusbar .icons{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.statusbar .iconrow{display:flex;align-items:center;gap:6px}
#hpMini{font-size:10px;font-weight:600;font-family:var(--mono);color:var(--ink2);letter-spacing:.3px}
#hpMini.low{color:#ff3b30}
.sb-left{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
#locBtn{color:var(--ink2);font-size:10px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
#locName{font-family:var(--mono);font-size:10px;color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:2px;height:11px}
.bars i{width:3px;background:currentColor;border-radius:1px;display:block}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}
.bars i:nth-child(3){height:8px}.bars i:nth-child(4){height:11px}
.batt{width:25px;height:12px;border:1.6px solid currentColor;border-radius:4px;position:relative;opacity:.9}
.batt::after{content:"";position:absolute;right:-4px;top:3.4px;width:2px;height:5px;background:currentColor;border-radius:0 2px 2px 0}
.batt i{position:absolute;inset:1.6px;width:70%;background:currentColor;border-radius:2px;transition:width .6s ease,background .6s ease}
.screen.spooked .batt i{width:13%;background:#ff4d4d;animation:battFlick 1.1s steps(2) infinite}
@keyframes battFlick{50%{opacity:.35}}
.screen.spooked .statusbar{text-shadow:var(--glow);animation:flicker 4.2s infinite}
@keyframes flicker{
  0%,96%,100%{opacity:1}
  97%{opacity:.35}98%{opacity:.9}99%{opacity:.5}
}

/* ── nav bar ────────────────────────────────────────────── */
.nav{
  position:relative;z-index:40;flex:0 0 auto;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:6px 18px 12px;border-bottom:.5px solid var(--line);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(10px);
  transition:border-color .8s ease,background .8s ease;
}
.nav .title{font-size:16px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.screen.spooked .nav .title{font-family:var(--display);font-size:24px;font-weight:400;letter-spacing:.6px;text-shadow:var(--glow)}
.nav .left{font-size:16px;color:var(--accent);justify-self:start}
.nav .right{justify-self:end}

.sendbtn{
  position:relative;border:0;cursor:pointer;border-radius:999px;
  padding:8px 20px 9px;font-family:var(--sys);font-size:15.5px;font-weight:600;letter-spacing:-.1px;
  background:var(--accent);color:var(--accent-ink);
  display:inline-flex;align-items:center;gap:7px;
  /* Shadow is static; only the scale pulses (transform is composited). */
  box-shadow:0 6px 20px -6px color-mix(in srgb,var(--accent) 88%,transparent);
  animation:breathe 2.6s ease-in-out infinite;
  transition:background .5s ease;
}
.sendbtn svg{width:14px;height:14px;transform:translateY(-.5px)}
.sendbtn::after{ /* breathing halo */
  content:"";position:absolute;inset:-3px;border-radius:999px;pointer-events:none;
  border:1.5px solid var(--accent);opacity:0;
  animation:halo 2.6s ease-out infinite;
}
@keyframes breathe{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.065)}
}
@keyframes halo{
  0%{opacity:.55;transform:scale(1)}
  70%{opacity:0;transform:scale(1.35)}
  100%{opacity:0;transform:scale(1.35)}
}
.sendbtn:hover{filter:brightness(1.08)}
.sendbtn:active{animation:none;transform:scale(.92)}
.sendbtn[disabled]{opacity:.32;pointer-events:none;animation:none}
.sendbtn[disabled]::after{display:none}

/* ── compose view ───────────────────────────────────────── */
.view{position:absolute;inset:56px 0 0;display:flex;flex-direction:column;z-index:30}
.view.hidden{pointer-events:none}

.fields{padding:0 18px;flex:0 0 auto}
.row{
  display:flex;gap:8px;align-items:flex-start;padding:11px 0;
  border-bottom:.5px solid var(--line);font-size:15px;flex-wrap:wrap;
  transition:border-color .8s ease;
}
.row .lbl{color:var(--ink2);flex:0 0 auto;transition:color .8s ease}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:color-mix(in srgb,var(--accent) 15%,transparent);
  color:var(--accent);border-radius:11px;padding:2px 9px;font-size:13.5px;font-weight:500;
  transition:background .6s ease,color .6s ease,transform .3s var(--spring);
}
.chip.more{background:transparent;color:var(--ink2)}
.subject{font-weight:600}

.body{
  padding:18px;font-size:15.5px;line-height:1.52;overflow-y:auto;flex:1 1 auto;
  -webkit-mask-image:linear-gradient(180deg,#000 92%,transparent);
}
.body p{margin-bottom:13px}
.body .sig{color:var(--ink2);font-size:13.5px;line-height:1.45;border-top:.5px solid var(--line);padding-top:11px;margin-top:4px}
.body .pumpkin{font-size:17px}

/* send lift-off */
.view.launch{animation:launch .72s var(--ease) forwards}
@keyframes launch{
  0%{transform:translateY(0) scale(1);opacity:1;filter:blur(0)}
  35%{transform:translateY(-14px) scale(.985)}
  100%{transform:translateY(-120%) scale(.72);opacity:0;filter:blur(7px)}
}

/* ── sending state ──────────────────────────────────────── */
.progress{
  position:absolute;top:0;left:0;height:2.5px;width:0;z-index:45;
  background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#fff));
  box-shadow:0 0 12px color-mix(in srgb,var(--accent) 70%,transparent);
}
.progress.run{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}

.sending{
  position:absolute;inset:56px 0 0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;text-align:center;padding:0 44px;
  opacity:0;pointer-events:none;transition:opacity .5s ease;
}
.sending.on{opacity:1}
.ring{width:74px;height:74px;position:relative}
.ring svg{transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:3.5;stroke-linecap:round}
.ring .track{stroke:var(--line)}
.ring .fill{stroke:var(--accent);stroke-dasharray:207;stroke-dashoffset:207;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 60%,transparent))}
.ring.run .fill{animation:sweep 5s linear forwards}
@keyframes sweep{to{stroke-dashoffset:0}}
.ring .count{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:19px;font-weight:600;
}
.sending h3{font-size:17px;font-weight:600;letter-spacing:-.2px}
.sending p{font-size:13.5px;color:var(--ink2);line-height:1.5;font-family:var(--mono)}
.dots::after{content:"";animation:dots 1.3s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ── daemon inbox list ──────────────────────────────────── */
.inbox{
  position:absolute;inset:56px 0 0;z-index:15;overflow:hidden;
  display:flex;flex-direction:column;opacity:0;transition:opacity .6s ease;
}
.inbox.on{opacity:1}
.inbox .scroll{overflow:hidden;flex:1 1 auto;padding-top:6px}
.mailrow{
  display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;
  padding:12px 18px;border-bottom:.5px solid var(--line);
  animation:rowIn .55s var(--spring) both;
}
@keyframes rowIn{
  from{opacity:0;transform:translateX(-26px) scale(.97)}
  to{opacity:1;transform:none}
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px;box-shadow:var(--glow)}
.mailrow .from{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.mailrow .subj{font-size:13.5px;margin-top:2px;color:var(--ink);opacity:.92}
.mailrow .prev{font-size:12.5px;color:var(--ink2);margin-top:2px;font-family:var(--mono);line-height:1.35}
.mailrow .time{font-size:12px;color:var(--ink2);white-space:nowrap;font-family:var(--mono)}

/* ── TOASTS — the main event ────────────────────────────── */
.toasts{
  position:absolute;top:98px;left:0;right:0;z-index:50;
  padding:0 12px;display:flex;flex-direction:column;gap:9px;pointer-events:none;
  perspective:900px;max-height:220px;overflow:hidden;
}
.toast{
  --tint:#ff4d4d;
  position:relative;transform-origin:50% 0%;
  background:rgba(26,26,30,.6);
  backdrop-filter:blur(12px);
  border:.5px solid rgba(255,255,255,.13);
  border-radius:20px;padding:11px 13px 12px;
  color:#fff;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.95), 0 0 0 .5px rgba(0,0,0,.4);
  display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;
  animation:toastIn .78s var(--spring) both;
  will-change:transform,opacity;
}
@keyframes toastIn{
  0%{opacity:0;transform:translateY(-118%) scale(.74) rotateX(-38deg)}
  55%{opacity:1}
  70%{transform:translateY(5px) scale(1.02) rotateX(2deg)}
  100%{opacity:1;transform:translateY(0) scale(1) rotateX(0)}
}
/* toast delivered by the slap sequence: no entrance anim, just a settle */
.toast.noanim{animation:none}
.toast.settle{animation:settle .3s var(--spring) both}
@keyframes settle{
  0%{transform:scale(1.06) rotate(-1.2deg);filter:blur(1.4px)}
  100%{transform:scale(1) rotate(0);filter:blur(0)}
}

/* ── SLAP LAYER — toast hits YOUR monitor first ─────────── */
.slap-layer{position:fixed;inset:0;z-index:200;pointer-events:none;perspective:1400px}
.slapper{
  position:fixed;left:50%;top:44%;margin:0;
  width:min(520px,86vw);
  transform:translate(-50%,-50%);
  transform-origin:50% 50%;
  will-change:transform,opacity,filter;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.95), 0 0 0 .5px rgba(0,0,0,.5);
}
.slapper .ico{width:44px;height:44px;font-size:23px;border-radius:12px}
.slapper{grid-template-columns:44px 1fr auto;padding:15px 17px 16px;border-radius:24px}
.slapper .head{font-size:12.5px}
.slapper .code{font-size:13px}
.slapper .msg{font-size:17.5px}
.slapper.absurd .msg{font-size:26px}
.slapper .addr{font-size:12.5px}

body.impact{animation:impact .34s ease}
@keyframes impact{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(6px,-5px)}
  55%{transform:translate(-5px,4px)}
  80%{transform:translate(3px,-2px)}
}

.toast.out{animation:toastOut .42s var(--ease) forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-40px) scale(.9);filter:blur(4px)}}

.toast .ico{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(160deg,var(--tint),color-mix(in srgb,var(--tint) 45%,#000));
  box-shadow:0 5px 14px -6px var(--tint);
  animation:icoPulse 2.2s ease-in-out infinite;
}
@keyframes icoPulse{50%{transform:scale(1.06) rotate(-3deg)}}
.toast .head{
  font-size:11.5px;font-weight:700;letter-spacing:.85px;text-transform:uppercase;
  color:rgba(255,255,255,.62);display:flex;align-items:center;gap:6px;
}
.toast .code{
  font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.3px;
  color:var(--tint);margin-top:3px;
}
.toast .msg{font-size:13.8px;line-height:1.38;margin-top:3px;letter-spacing:-.1px}
.toast .addr{
  font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.48);
  margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.toast .ago{font-size:11.5px;color:rgba(255,255,255,.42);font-family:var(--mono)}
.toast.absurd{border-color:color-mix(in srgb,var(--tint) 40%,transparent)}
.toast.absurd .msg{font-family:var(--display);font-size:19px;line-height:1.22;letter-spacing:.4px}
.toast.peak{animation:jitter 2.6s ease-in-out infinite}
@keyframes jitter{
  0%,92%,100%{transform:translate(0,0) rotate(0)}
  94%{transform:translate(-2px,1px) rotate(-.5deg)}
  96%{transform:translate(2px,-1px) rotate(.6deg)}
  98%{transform:translate(-1px,0) rotate(-.3deg)}
}
/* stacked depth for older toasts (no backdrop blur behind the top card) */
.toast[data-depth="1"]{transform:scale(.965) translateY(-3px);opacity:.86;backdrop-filter:none;background:rgba(26,26,30,.88)}
.toast[data-depth="2"]{transform:scale(.93) translateY(-6px);opacity:.6;backdrop-filter:none;background:rgba(26,26,30,.9)}
.toast[data-depth="3"]{transform:scale(.895) translateY(-9px);opacity:.32;backdrop-filter:none;background:rgba(26,26,30,.92)}

/* ── failure verdict card ───────────────────────────────── */
.verdict{
  position:absolute;left:16px;right:16px;bottom:34px;z-index:52;
  background:rgba(10,14,11,.82);backdrop-filter:blur(12px);
  border:.5px solid color-mix(in srgb,var(--accent) 34%,transparent);
  border-radius:26px;padding:20px 20px 17px;text-align:center;
  box-shadow:0 26px 60px -24px #000, 0 0 60px -22px var(--accent);
  transform:translateY(140%);opacity:0;
  transition:transform .78s var(--spring),opacity .5s ease;
}
.verdict.on{transform:translateY(0);opacity:1}
.verdict h2{font-family:var(--display);font-size:33px;font-weight:400;line-height:1;letter-spacing:.8px;color:var(--accent);text-shadow:var(--glow)}
.verdict .tally{font-family:var(--mono);font-size:12.5px;color:var(--ink2);margin-top:9px;letter-spacing:.4px}
.verdict .tally b{color:var(--ink)}
.reset{
  margin-top:15px;width:100%;border:0;cursor:pointer;border-radius:15px;padding:13px;
  font-family:var(--sys);font-size:15.5px;font-weight:600;letter-spacing:-.2px;
  background:var(--accent);color:var(--accent-ink);
  transition:transform .2s var(--spring),filter .2s ease;
}
.reset:hover{filter:brightness(1.12)}
.reset:active{transform:scale(.96)}

/* ── home bar ───────────────────────────────────────────── */
.homebar{
  position:absolute;bottom:9px;left:50%;transform:translateX(-50%);
  width:138px;height:5px;border-radius:3px;background:var(--ink);opacity:.28;z-index:58;
  transition:background .8s ease;pointer-events:none;
}
.island{pointer-events:none}

/* ── caption under phone ────────────────────────────────── */
.caption{
  text-align:center;color:#6f6a80;font-family:var(--mono);font-size:11.5px;
  letter-spacing:1.4px;text-transform:uppercase;max-width:392px;line-height:1.7;
}
.caption b{color:#7cff4f;font-weight:500}

@media (max-height:960px){
  .stage{transform:scale(.84);transform-origin:top center;margin-bottom:-150px}
}
@media (max-width:520px){
  .stage{transform:scale(.74);transform-origin:top center;margin-bottom:-230px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ══ CODERWARZ · iOS reskin (uses phone vars) ══ */
#app{
  position:absolute;inset:56px 0 0;z-index:30;
  overflow-y:auto;overflow-x:hidden;
  padding:0 14px 40px;margin:0;max-width:none;left:0;right:0;
  transform:none;background:var(--bg);color:var(--ink);
  font-family:var(--sys);font-size:14px;line-height:1.45;
  transition:background .8s ease,color .8s ease;
}
#app::-webkit-scrollbar{width:0}
#eventOverlay{
  position:absolute!important;inset:56px 0 0!important;width:auto!important;height:auto!important;
  background:rgba(0,0,0,.35)!important;backdrop-filter:blur(8px);
  display:none;justify-content:center;align-items:flex-end;z-index:65!important;
  padding:14px;
}
#eventOverlay > div{
  background:color-mix(in srgb,var(--bg) 88%,transparent)!important;
  backdrop-filter:blur(12px);
  border:.5px solid var(--line)!important;border-radius:22px!important;
  padding:18px!important;max-width:100%!important;width:100%;
  color:var(--ink)!important;text-align:center!important;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.5);
  animation:settle .5s var(--spring) both;
}
.game .header{background:transparent;border:0;padding:0;margin:0 0 8px}
/* sticky tab bar — stays pinned while the tab content scrolls */
#app .header{position:sticky;top:0;z-index:40;background:var(--bg);margin:0 -14px;padding:2px 14px 9px;border-bottom:.5px solid var(--line)}
.game .header h1{font-size:22px;font-weight:700;letter-spacing:-.4px;text-align:left}
.tabs{
  display:flex;gap:2px;margin:0 0 10px;padding:2px;border:0;border-bottom:none;
  background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:11px;
}
.tab{
  flex:1;padding:7px 2px;background:transparent;color:var(--ink2);
  border:0;border-bottom:none;font-family:var(--sys);font-size:11px;font-weight:600;
  cursor:pointer;text-align:center;letter-spacing:.2px;border-radius:8px;white-space:nowrap;
}
.tab.active{background:var(--bg);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.tab{position:relative}
.tabs{position:relative}
.tab-indicator{position:absolute;bottom:0;left:0;height:2px;width:calc(100% / 6);pointer-events:none}
.tab-indicator i{display:block;height:100%;border-radius:2px;background:var(--accent);transition:transform .3s cubic-bezier(0.65,0,0.35,1)}
#content.tab-enter-right{animation:tabInRight .3s cubic-bezier(0.65,0,0.35,1)}
#content.tab-enter-left{animation:tabInLeft .3s cubic-bezier(0.65,0,0.35,1)}
@keyframes tabInRight{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
@keyframes tabInLeft{from{transform:translateX(-26px);opacity:0}to{transform:none;opacity:1}}
.hack-tab-bar{position:absolute;left:10px;right:10px;bottom:2px;height:3px;border-radius:2px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden;pointer-events:none}
.hack-tab-bar i{display:block;height:100%;width:100%;border-radius:2px;background:#30d158;transition:width .25s linear}
.tab.locked{opacity:.35}
.tab:hover{color:var(--ink)}
.stats-bar{
  display:flex;flex-direction:column;gap:1px;margin:0;
  font-family:var(--mono);font-size:12px;color:var(--ink2);
}
.srow1{display:grid;grid-template-columns:1fr auto 1fr;gap:0 12px;align-items:center}
.srow1 .day{text-align:right;justify-self:end}
.srow2{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stats-bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.stats-bar .cash{color:#248a3d;font-weight:700;font-size:13px;line-height:1.3}
.stats-bar .bank{color:#9a7400;font-weight:600}
.stats-bar .debt{color:#ff3b30;font-weight:700;text-align:center}
.warn{color:#ff3b30;font-weight:700}
.stats-bar .wanted-tag{color:#ff3b30;font-weight:700;font-size:10px;letter-spacing:1px;animation:wantedBlink 1.2s steps(2) infinite;white-space:nowrap}
@keyframes wantedBlink{50%{opacity:.35}}
.stats-bar .day,.stats-bar .pock{text-align:right}
.stats-bar .bank,.stats-bar .debt,.stats-bar .pock,.stats-bar .day{cursor:pointer}
.stats-bar .bank:active,.stats-bar .debt:active,.stats-bar .pock:active,.stats-bar .day:active{opacity:.55}
.pf-hero{text-align:center;margin:2px 0 6px}
.pf-hero .l{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--ink2)}
.pf-hero .v{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--ink);margin-top:2px}
.screen.dark .stats-bar .cash{color:#30d158}
.screen.dark .stats-bar .bank{color:#ffd60a}
/* ══ INFECTION PERF — blurs off + shake steadied while glitching ══ */
.screen.infx1 .nav,.screen.infx2 .nav{backdrop-filter:none}
.screen.infx1 .toast,.screen.infx2 .toast,
.screen.infx1 .noticenter,.screen.infx2 .noticenter,
.screen.infx1 .msgcenter,.screen.infx2 .msgcenter{backdrop-filter:none;background:rgba(26,26,30,.94)}
.screen.steady #app{animation:none !important}
.screen.calm #app,.screen.calm .statusbar{animation:none !important}
.screen.calm .batt i{animation:none !important}
/* ══ INFECTION GLITCH TIERS (demo language: flicker, jitter, battery blink) ══ */
.screen.infx1 #app .title,.screen.infx1 .stats-bar,.screen.infx1 .drug-name,.screen.infx1 .file-value,.screen.infx1 .hack-stat .val{
  text-shadow:1px 0 rgba(255,45,85,.28),-1px 0 rgba(0,210,255,.28);
}
.screen.infx1 #app{animation:none}
.screen.infx2 #app .title,.screen.infx2 .stats-bar,.screen.infx2 .drug-name,.screen.infx2 .file-value,.screen.infx2 .hack-stat .val,.screen.infx2 .menu-btn{
  text-shadow:1.5px 0 rgba(255,45,85,.55),-1.5px 0 rgba(0,220,255,.55);
}
.screen.infx2 #app{animation:none}
.screen.infx2 .statusbar{text-shadow:0 0 8px rgba(255,60,60,.5);animation:infxFlick 5s infinite}
@keyframes infxFlick{0%,94%,100%{opacity:1}95%{opacity:.4}96%{opacity:.9}97%{opacity:.55}98%{opacity:1}}
.screen.infx2 .batt i{background:#ff3b30;animation:infxBatt 1.1s steps(2) infinite}
@keyframes infxBatt{50%{opacity:.35}}
/* ══ STARTUP PRELOADER (impossible-shapes chamber) ══ */
#ch3{position:absolute;inset:0;z-index:66;border-radius:48px;overflow:hidden;transition:none;perspective:750px;
  display:flex;align-items:center;justify-content:center;opacity:1;pointer-events:all;
  background:radial-gradient(ellipse at center,#0e0a1a 0%,#030308 70%)}
.impossible-shape{position:absolute;top:50%;left:50%;transform-style:preserve-3d;will-change:transform}
.shape-face{position:absolute;border:1px solid rgba(255,255,255,0.32);background:rgba(20,16,34,0.55);backdrop-filter:blur(1px);
  box-shadow:0 0 16px rgba(255,255,255,0.16),0 0 56px rgba(255,255,255,0.08),inset 0 0 22px rgba(255,255,255,0.06);}
.glitch-line{position:absolute;width:100%;height:1px;background:rgba(200,192,184,0.03);animation:glitchScan 8s linear infinite}
@keyframes glitchScan{0%{top:-10%;opacity:0}5%{opacity:0.5}95%{opacity:0.5}100%{top:110%;opacity:0}}
.title{
  font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;

}
.menu-btn{

  cursor:pointer;text-align:center;letter-spacing:-.1px;
}
.menu-btn:hover{filter:brightness(1.08)}
.menu-btn:active{transform:scale(.97)}
.menu-btn:disabled{opacity:.35}
#content .menu-btn:not([style*="background"]){background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}

.drug-row,.file-row,.upgrade-row,.city-btn{

.drug-row,.file-row,.upgrade-row{border-left:.5px solid var(--line);border-right:.5px solid var(--line)}
.drug-row:first-of-type,.file-row:first-of-type,.upgrade-row:first-of-type{border-top:.5px solid var(--line)}
.drug-row:last-of-type,.file-row:last-of-type,.upgrade-row:last-of-type{border-bottom:.5px solid var(--line);margin-bottom:6px}

.drug-name{font-weight:600;flex:1}

.drug-input{

}
.city-btn{border:.5px solid var(--line);border-radius:13px;margin:5px 0;width:100%;text-align:left;font-family:var(--sys)}

.city-distance{margin-left:auto;color:var(--ink2);font-size:11px;font-family:var(--mono)}
.log{border:.5px solid var(--line);border-radius:13px;padding:10px;margin-top:8px;max-height:170px;overflow-y:auto;font-size:12px;background:color-mix(in srgb,var(--bg) 82%,transparent);font-family:var(--sys)}
.log .event-good{color:#248a3d}.log .event-bad{color:#ff3b30}.log .event-neutral{color:var(--ink2)}
.info-box{
  border:.5px solid var(--line);border-radius:14px;padding:11px 13px;margin:8px 0;font-size:12.5px;

}
.bank-row{display:flex;gap:6px;margin:6px 0;align-items:center;font-size:12px}
.bank-row input{flex:1}
.hack-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.hack-stat,.virus-stat{background:color-mix(in srgb,var(--bg) 82%,transparent);border:.5px solid var(--line);border-radius:13px;padding:9px 11px;font-size:11.5px;color:var(--ink2)}
.hack-stat .val{color:var(--ink);font-weight:700;font-family:var(--mono)}
.scan-bar{width:100%;height:6px;background:color-mix(in srgb,var(--ink) 8%,transparent);border:0;border-radius:4px;margin-top:4px;overflow:hidden}

.file-type{font-weight:700;min-width:44px;font-size:11px}
.file-type.text{color:var(--accent)}.file-type.image{color:#af52de}.file-type.sound{color:#ff9f0a}.file-type.video{color:#ff3b30}
.file-stat{color:var(--ink2);font-family:var(--mono);font-size:11px}
.file-value{color:var(--ink);font-family:var(--mono);font-size:11px;font-weight:700}
.virus-window{border:.5px solid var(--line);background:#020202;padding:10px;margin-bottom:8px;text-align:center;border-radius:16px;overflow:hidden}
.virus-canvas{display:block;width:100%;max-width:360px;height:230px;margin:0 auto;background:#020202;border:0;border-radius:12px}
.virus-status{margin-top:6px;font-size:11px;font-family:var(--mono)}
.virus-status.weak{color:#ff9f0a}.virus-status.dead{color:#ff3b30}
.virus-food{display:flex;gap:6px;align-items:stretch;margin:6px 0}
.virus-food-count{flex:1;border:.5px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);padding:9px;border-radius:13px;font-size:11px}
.virus-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0;overflow:visible}
.virus-stat{position:relative}
.virus-stat .level{color:var(--accent);float:right;font-weight:700;font-family:var(--mono)}
.virus-stat .xp{color:var(--ink2);display:block;margin-top:2px;font-family:var(--mono);font-size:10px}
.virus-stat .nodes{display:flex;gap:3px;margin-top:6px}
.virus-stat .node{width:8px;height:8px;padding:0;border-radius:50%;border:1px solid var(--accent);opacity:.3}
.virus-stat .node.on{background:var(--accent);opacity:1}
.virus-stat .skilldet{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%) translateY(2px);white-space:nowrap;pointer-events:none;z-index:50;background:rgba(26,26,30,.95);border:.5px solid var(--line);border-radius:9px;padding:5px 9px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:#fff;box-shadow:0 8px 24px -8px rgba(0,0,0,.6);margin:0}

.market-ticker{overflow:hidden;border:.5px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--bg) 82%,transparent);margin:8px 0;white-space:nowrap}
.market-ticker-track{display:inline-flex;min-width:max-content;animation:marketTicker 22s linear infinite}
@keyframes marketTicker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-item{display:inline-block;padding:6px 12px;border-right:.5px solid var(--line);font-size:10px;font-family:var(--mono)}
.ticker-item.up,.up{color:#248a3d}.ticker-item.down,.down{color:#ff3b30}.ticker-item.event,.event-row{color:#ff9f0a}.flat{color:var(--ink2)}
.market-row{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"tick name price" "candles candles candles" "chg held trade";gap:3px 8px;align-items:center;padding:10px 12px;border:.5px solid var(--line);border-bottom:0;background:color-mix(in srgb,var(--bg) 82%,transparent);margin:0;font-size:12px;cursor:pointer;font-family:var(--sys)}

.nc-settitle{font-size:13px;font-weight:700;color:#fff}
.nc-item.clickable{cursor:pointer}
.nc-item.clickable:hover{background:rgba(255,255,255,.12)}
.nc-item .nunread{width:9px;height:9px;border-radius:50%;background:#0a84ff;margin-top:6px;flex:0 0 auto}
/* ══ messages (DM inbox, bottom-left button) ══ */
#msgBtn{position:absolute;left:14px;bottom:22px;z-index:60;width:42px;height:42px;border-radius:50%;border:.5px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);color:var(--ink);font-size:19px;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 24px -10px rgba(0,0,0,.5)}
#msgBtn:active{transform:scale(.93)}
.msgbadge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:10px;background:#ff3b30;color:#fff;font-size:10px;font-weight:700;line-height:18px;text-align:center;padding:0 5px;font-family:var(--sys)}
.msgcenter{position:absolute;top:60px;left:10px;right:10px;bottom:30px;z-index:64;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border:.5px solid var(--line);border-radius:22px;color:var(--ink);box-shadow:0 24px 60px -20px rgba(0,0,0,.7);transform-origin:50% 100%;transform:scaleY(.6) translateY(12px);opacity:0;pointer-events:none;transition:transform .38s var(--spring),opacity .25s ease;display:flex;flex-direction:column;overflow:hidden}
.msgcenter.on{transform:none;opacity:1;pointer-events:auto}
.msg-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-size:13px;font-weight:700}
.msg-head .spacer{flex:1}
.msg-head button{border:0;background:none;color:var(--accent);font-family:var(--sys);font-size:14px;font-weight:700;cursor:pointer;padding:4px 2px}
.msg-list{overflow-y:auto;padding:2px 10px 12px;display:flex;flex-direction:column;gap:8px}
.msg-list::-webkit-scrollbar{width:0}
.msg-thread{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--ink) 6%,transparent);border:.5px solid var(--line);border-radius:15px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;color:var(--ink);font-family:var(--sys)}
.msg-thread:active{transform:scale(.98)}
.msg-avatar{width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--accent) 20%,transparent)}
.msg-thread .t-name{font-size:13px;font-weight:700}
.msg-thread .t-prev{font-size:12px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.msg-thread .t-when{font-size:10px;color:var(--ink2);font-family:var(--mono);margin-left:auto;flex:0 0 auto}
.msg-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.msg-bubble{max-width:85%;background:color-mix(in srgb,var(--ink) 8%,transparent);border:.5px solid var(--line);border-radius:16px;border-top-left-radius:5px;padding:9px 12px;font-size:13px;line-height:1.45}
.msg-bubble .m-when{display:block;font-size:10px;color:var(--ink2);font-family:var(--mono);margin-top:5px}
.msg-empty{font-size:12.5px;color:var(--ink2);text-align:center;padding:18px 10px}
/* ══ DARK MODE — flips the iOS vars, whole game re-skins ══ */
.screen.dark{
  --bg:#0b0b0f;--bg2:#17171d;--ink:#f4f4f6;--ink2:#9c9ca6;--line:#2b2b32;
  --accent:#0a84ff;--accent-ink:#ffffff;
}
.screen.dark .log .event-good,.screen.dark .up,.screen.dark .ticker-item.up{color:#30d158}
.back-btn{margin-top:10px}
.pipeline{display:flex;gap:5px;margin:6px 0;flex-wrap:wrap}
.pipe-stage{flex:1;min-width:80px;border:.5px solid var(--line);padding:6px;background:color-mix(in srgb,var(--bg) 82%,transparent);font-size:10px;text-align:center;border-radius:10px}

</style>

<div class="bats" id="bats"></div>

<div class="burst-layer" id="burstLayer"></div>
<div class="slap-layer" id="slapLayer"></div>

<div class="stage">
  <div class="tilt3d" id="tilt">
  <div class="phone" id="phone">
    <div class="phone-frame-hi"></div>
    <div class="island"></div>
    <div class="screen" id="screen">

      <div class="progress" id="progress"></div>

      <!-- status bar -->
      <div class="statusbar">
        <span class="sb-left">
          <span id="gamedate">—</span>
          <span id="locBtn" title="Current city">📍<span id="locName"></span></span>
        </span>
        <span class="icons" id="notiBtn" title="Notifications">
          <span style="display:flex;align-items:center;gap:4px">
            <span id="hpMini">HP 100</span>
            <span style="position:relative;display:inline-flex;align-items:center">
              <span id="notiBell" style="font-size:12px;line-height:1">🔔</span>
              <span class="ncbadge" id="ncBadge" style="display:none">0</span>
            </span>
          </span>
          <span class="iconrow">
          <span class="bars"><i></i><i></i><i></i><i></i></span>
          <span style="font-size:13px;font-weight:700">5G</span>
          <span class="batt"><i></i></span>
          </span>
        </span>
      </div>

      <!-- ══ STARTUP PRELOADER ══ -->
      <div id="ch3">
        <div class="impossible-shape" id="impossibleShape"></div>
        <div class="glitch-line"></div>
        <div class="glitch-line" style="animation-delay:-2s"></div>
        <div class="glitch-line" style="animation-delay:-4s"></div>
        <div class="glitch-line" style="animation-delay:-6s"></div>

      <div class="game" id="app"><div id="content"></div></div>

      <!-- ══ NOTIFICATION CENTER ══ -->
      <div class="noticenter" id="noticenter">
        <div class="nc-head"><span>Notifications</span><span class="nc-actions"><button id="ncTheme" title="Toggle dark mode">🌙</button><button id="ncSettings" title="Notification settings">&#9881;</button><button id="ncClear">Clear</button></span></div>
        <div class="nc-list" id="ncList"></div>

      <div id="eventOverlay" style="display:none;position:absolute;justify-content:center;align-items:center;z-index:65"></div>

      <!-- ══ TOASTS ══ -->

      <button id="msgBtn" title="Messages">💬<span class="msgbadge" id="msgBadge" style="display:none">0</span></button>

    </div>
  </div>
  </div>
</div>

<script>

const $ = id => document.getElementById(id);
const phone=$("phone"), screen=$("screen"), toasts=$("toasts"),
      slapLayer=$("slapLayer"), burstLayer=$("burstLayer"),
      notiBtn=$("notiBtn"), noticenter=$("noticenter"), ncList=$("ncList"),
      ncBadge=$("ncBadge"), ncClear=$("ncClear"), ncSettings=$("ncSettings"), ncTheme=$("ncTheme"),
      msgBtn=$("msgBtn"), msgcenter=$("msgcenter"), msgHead=$("msgHead"), msgList=$("msgList"), msgBadge=$("msgBadge");
let timers=[];
// Self-cleaning: entries splice themselves out on fire so the list
// can't grow forever. Cleared on new game (see initGame).
const wait=(fn,ms)=>{ const id=setTimeout(()=>{ const i=timers.indexOf(id); if(i>=0) timers.splice(i,1); fn(); },ms); timers.push(id); return id; };

const BAT_SVG=`<svg viewBox="0 0 64 28" fill="currentColor"><path d="M32 6c3-5 9-6 13-3 3 2 4 6 9 4 4-2 8-6 10-7-3 6-4 12-9 15-6 4-13 2-17 7-1 1-2 4-6 4s-5-3-6-4c-4-5-11-3-17-7C4 12 3 6 0 0c2 1 6 5 10 7 5 2 6-2 9-4 4-3 10-2 13 3z"/></svg>`;
(function makeBats(){
  const wrap=$("bats");
  for(let i=0;i<7;i++){
    const b=document.createElement("div");
    b.className="bat"; b.innerHTML=BAT_SVG;
    b.style.top=(Math.random()*80)+"%";
    b.style.animationDuration=(16+Math.random()*16)+"s";
    b.style.animationDelay=(-Math.random()*20)+"s";
    b.style.width=(16+Math.random()*26)+"px";
    b.style.color=["#2a1b3d","#1d2b22","#3a2450"][i%3];
    wrap.appendChild(b);
  }
})();
/* status bar shows the IN-GAME date, updated on every render + interval */
window.phoneDate=function(){
  const el=$("gamedate");
  if(!el) return;
  if(window.G && window.G.month){
    const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    el.textContent=M[window.G.month-1]+" "+window.G.mday+", "+String(window.G.year).slice(-2);
  }else{
    el.textContent=new Date().toLocaleDateString([],{month:"short",day:"numeric"});
  }
  const hp=$("hpMini");
  if(hp&&window.G&&window.G.hp!=null){
    hp.textContent=`HP ${window.G.hp}`+(window.G.armor>0?` 🛡${window.G.armor}`:"");
    hp.classList.toggle("low",window.G.hp<30);
  }
  const loc=$("locName");
  if(loc&&window.G&&window.G.city!=null&&window.CITIES&&window.CITIES[window.G.city]){
    loc.textContent=window.CITIES[window.G.city].name;
  }
};
window.phoneDate(); setInterval(window.phoneDate,5000);
/* remote float toggle from the embedding page (stop-floating button) */
window.addEventListener("message",e=>{if(e.data&&e.data.type==="phone-float"){document.body.classList.toggle("nofloat",!e.data.on);}});

function buildToast(b){
  const el=document.createElement("div");
  el.className="toast"+(b.absurd?" absurd":"");
  el.style.setProperty("--tint",b.tint);
  el.innerHTML=`
    <div class="ico">${b.ico}</div>
    <div>
      <div class="head">${b.head||"Coderwarz"}</div>
      <div class="code">${b.code||""}</div>
      <div class="msg">${b.msg}</div>
      <div class="addr">${b.addr||""}</div>
    </div>
    <div class="ago">${b.ago||"now"}</div>`;
  return el;
}
/* Toast visuals are held until the boot preloader finishes so nothing
   pops over it. History + badges still record immediately. */
window._toastQueue=[];
window._toastsLive=false;
function pushToast(b){
  /* feed notification center history (message-linked notis carry msgId/thread) */
  window._notis.unshift({ico:b.ico,tint:b.tint,head:b.head||"Coderwarz",msg:b.msg,when:ncTime(),msgId:(b.msgId==null?null:b.msgId),thread:(b.thread||null),action:(b.action||null),read:false});
  if(window._notis.length>10) window._notis.length=10;
  window._ncUnread=(window._ncUnread||0)+1; ncUpdateBadge();
  if(noticenter.classList.contains("on")&&!window._ncSettings) ncRender();
  if(!window._toastsLive){ window._toastQueue.push(b); return; }
  showToastVisual(b);
}
function flushToastQueue(){
  if(window._toastsLive) return;
  window._toastsLive=true;
  const q=window._toastQueue||[]; window._toastQueue=[];
  q.forEach((b,i)=>{ wait(()=>showToastVisual(b),i*650); });
}
window.addEventListener("chamber-done",flushToastQueue);
setTimeout(flushToastQueue,30000);
function showToastVisual(b){
  const slot=buildToast(b);
  slot.classList.add("noanim");
  slot.style.visibility="hidden";
  if(b.msgId!=null||b.action){
    slot.style.pointerEvents="auto";
    slot.style.cursor="pointer";
    slot.title=b.msgId!=null?"Open messages":"Open bank";
    slot.addEventListener("click",e=>{e.stopPropagation();ncClose();if(b.msgId!=null)openMessages(b.thread);else if(b.action==="bank")goBank();});
  }
  toasts.prepend(slot);
  restack();
  const target=slot.getBoundingClientRect();
  const flyer=buildToast(b);
  flyer.classList.add("slapper","noanim");
  slapLayer.appendChild(flyer);
  const from=flyer.getBoundingClientRect();
  const base="translate(-50%,-50%) ";
  const s=target.width/from.width;
  const dx=(target.left+target.width/2)-(from.left+from.width/2);
  const dy=(target.top+target.height/2)-(from.top+from.height/2);
  const anim=flyer.animate([
    {offset:0,    opacity:0, filter:"blur(16px)", transform:base+"scale(2.35) rotate(-7deg) translateZ(340px)"},
    {offset:.14,  opacity:1, filter:"blur(0px)",  transform:base+"scale(1.05) rotate(1.6deg)"},
    {offset:.20,             transform:base+"scale(.955) rotate(-.9deg) skewX(3deg)"},
    {offset:.27,             transform:base+"scale(1.01) rotate(.3deg)"},
    {offset:.34,             transform:base+"scale(1) rotate(0)"},
    {offset:.52,             transform:base+`translate(${dx*.22}px,${dy*.22}px) scale(${1-(1-s)*.22}) skewX(11deg) skewY(-3deg) rotateY(-26deg)`},
    {offset:.68,             transform:base+`translate(${dx*.52}px,${dy*.52}px) scale(${1-(1-s)*.55}) skewX(-8deg) skewY(4deg) rotateY(18deg) rotateX(-12deg)`},
    {offset:.84,             transform:base+`translate(${dx*.82}px,${dy*.82}px) scale(${1-(1-s)*.86}) skewX(5deg) rotateY(-22deg) rotateX(14deg)`},
    {offset:1,    opacity:1, transform:base+`translate(${dx}px,${dy}px) scale(${s}) rotateY(-15deg) rotateX(10deg)`}
  ],{duration:420,easing:"cubic-bezier(.22,1,.3,1)",fill:"forwards"});
  if(b.flash){
    wait(()=>{
      document.body.classList.add("impact");
      setTimeout(()=>document.body.classList.remove("impact"),340);
    },160);
  }
  if(navigator.vibrate) navigator.vibrate(b.flash?[45,60,45]:22);
  // Message/DM toasts linger ~5s longer so story texts can be read.
  const dwell = b.msgId != null ? 7000 : 2000;
  anim.finished.then(()=>{
    flyer.remove();
    slot.style.visibility="";
    wait(()=>{ slot.classList.add("out"); setTimeout(()=>slot.remove(),420); }, dwell);
  }).catch(()=>{ flyer.remove(); slot.style.visibility=""; });
}
function restack(){
  [...toasts.children].forEach((t,i)=>{
    if(i>3){ t.classList.add("out"); setTimeout(()=>t.remove(),420); }
    else t.dataset.depth = i>1 ? Math.min(i-1,3) : "";
  });
}
/* ── notification center (top-right dropdown) ── */
window._notis=[]; window._ncUnread=0;
window._ncPrefs={good:true,bad:true,neutral:true};
try{var _p=JSON.parse(localStorage.getItem("dwNotiPrefs"));if(_p)window._ncPrefs=Object.assign(window._ncPrefs,_p);}catch(e){}
function ncSavePrefs(){try{localStorage.setItem("dwNotiPrefs",JSON.stringify(window._ncPrefs));}catch(e){}}
function ncTime(){ return new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}); }
function ncRender(){
  window._ncSettings=false;
  if(!ncList) return;
  if(!window._notis.length){ ncList.innerHTML=`<div class="nc-empty">No notifications yet.</div>`; return; }
  ncList.innerHTML=window._notis.map((n,i)=>`
    <div class="nc-item${(n.msgId!=null||n.action)?" clickable":""}" style="--tint:${n.tint}"${(n.msgId!=null||n.action)?` data-ni="${i}"`:""}>
      <div class="ico">${n.ico}</div>
      <div><div class="nhead">${n.head}</div><div class="nmsg">${n.msg}</div><div class="nwhen">${n.when}${n.msgId!=null?" · tap to open messages":(n.action==="bank"?" · tap to open bank":"")}</div></div>
    </div>`).join("");
}
function ncUpdateBadge(){
  if(!ncBadge) return;
  let u=0;
  if(Array.isArray(window._notis)) u=window._notis.filter(n=>!n.read).length;
  window._ncUnread=u;
  ncBadge.style.display=u>0?"block":"none";
  ncBadge.textContent=u>9?"9+":u;
}
/* Reading from either side clears both: noti items linked to a message
   share read state with the inbox thread. */
function markLinkedMessagesRead(){
  if(!Array.isArray(G.messages)) return;
  const ids={};
  (window._notis||[]).forEach(n=>{ if(n.msgId!=null) ids[n.msgId]=1; });
  let newly=0;
  G.messages.forEach(m=>{ if(!m.read&&ids[m.id]){ m.read=true; newly++; } });
  if(newly){ window._msgUnread=Math.max(0,(window._msgUnread||0)-newly); msgUpdateBadge(); }
  if(msgcenter&&msgcenter.classList.contains("on")) renderMsgCenter();
}
function ncOpen(){ closeMessages(); ncRender(); noticenter.classList.add("on"); (window._notis||[]).forEach(n=>{n.read=true;}); window._ncUnread=0; ncUpdateBadge(); markLinkedMessagesRead(); }
function ncClose(){ if(noticenter) noticenter.classList.remove("on"); }
if(notiBtn) notiBtn.addEventListener("click",e=>{ e.stopPropagation(); noticenter.classList.contains("on")?ncClose():ncOpen(); });
/* ══ messages: DM inbox (separate from notis; message notis link here) ══ */
window._msgUnread=0;
function msgUpdateBadge(){
  if(!msgBadge) return;
  const u=window._msgUnread||0;
  msgBadge.style.display=u>0?"block":"none";
  msgBadge.textContent=u>9?"9+":u;
}
function msgThreads(){
  const seen={};
  (G.messages||[]).forEach(m=>{ if(!seen[m.from]) seen[m.from]=m; });
  return Object.values(seen);
}
function openMessages(thread){
  ncClose();
  G.msgThread=thread||null;
  renderMsgCenter();
  if(msgcenter) msgcenter.classList.add("on");
}
function closeMessages(){
  if(msgcenter) msgcenter.classList.remove("on");
  if(G) G.msgThread=null;
}
function renderMsgCenter(){
  if(!msgHead||!msgList) return;
  const threads=msgThreads();
  if(G.msgThread){
    const name=G.msgThread;
    const convo=(G.messages||[]).filter(m=>m.from===name).slice().reverse();
    let newly=0;
    const readIds={};
    (G.messages||[]).forEach(m=>{ if(m.from===name&&!m.read){ m.read=true; readIds[m.id]=1; newly++; } });
    window._msgUnread=Math.max(0,(window._msgUnread||0)-newly); msgUpdateBadge();
    (window._notis||[]).forEach(n=>{ if(n.msgId!=null&&readIds[n.msgId]) n.read=true; });
    ncUpdateBadge();
    msgHead.innerHTML=`<button id="msgBack">‹ Back</button><span>${name}</span><span class="spacer"></span><button id="msgClose">✕</button>`;
    msgList.innerHTML=convo.length?convo.map(m=>`
      <div style="display:flex;justify-content:flex-start">
        <div class="msg-bubble">${m.text}<span class="m-when">Day ${m.day} · ${m.date}</span></div>
      </div>`).join(""):`<div class="msg-empty">No messages yet.</div>`;
    msgList.scrollTop=msgList.scrollHeight;
  }else{
    msgHead.innerHTML=`<span>Messages</span><span class="spacer"></span><button id="msgClose">✕</button>`;
    msgList.innerHTML=threads.length?threads.map(t=>{
      const unread=(G.messages||[]).some(m=>m.from===t.from&&!m.read);
      const prev=t.text.length>64?t.text.slice(0,64)+"…":t.text;
      return `<button class="msg-thread" data-thread="${t.from.replace(/"/g,"&quot;")}">
        <span class="msg-avatar">💬</span>
        <span><span class="t-name">${t.from}</span><div class="t-prev">${prev}</div></span>
        ${unread?`<span class="msg-dot"></span>`:""}
        <span class="t-when">Day ${t.day}</span>
      </button>`;
    }).join(""):`<div class="msg-empty">No messages yet.</div>`;
  }
  const back=document.getElementById("msgBack");
  if(back) back.addEventListener("click",e=>{e.stopPropagation();G.msgThread=null;renderMsgCenter();});
  const close=document.getElementById("msgClose");
  if(close) close.addEventListener("click",e=>{e.stopPropagation();closeMessages();});
  msgList.querySelectorAll(".msg-thread").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();openMessages(b.dataset.thread);}));
}
if(msgBtn) msgBtn.addEventListener("click",e=>{ e.stopPropagation(); if(msgcenter&&msgcenter.classList.contains("on")){closeMessages();}else{openMessages(null);} });
if(msgcenter) msgcenter.addEventListener("click",e=>{e.stopPropagation();});
if(ncClear) ncClear.addEventListener("click",e=>{ e.stopPropagation(); window._notis=[]; ncUpdateBadge(); ncRender(); });
if(ncSettings) ncSettings.addEventListener("click",e=>{ e.stopPropagation(); ncRenderSettings(); });
function ncRenderSettings(){
  window._ncSettings=true;
  if(!ncList) return;
  const defs=[["good","Good news","Sales, payments and wins"],["bad","Warnings","Busts, losses and threats"],["neutral","Info","Travel, dates and general log"]];
  const icons={good:"✅",bad:"🚨",neutral:"💬"};
  ncList.innerHTML=`<div class="nc-sethead"><button class="nc-back" id="ncBack">‹ Back</button><span class="nc-settitle">Notification Settings</span></div>`+
    defs.map(d=>`<label class="nc-setrow"><input type="checkbox" data-ntype="${d[0]}"${window._ncPrefs[d[0]]!==false?" checked":""}><span class="t">${icons[d[0]]} ${d[1]}<span class="d">${d[2]}</span></span></label>`).join("")+
    `<label class="nc-setrow"><input type="checkbox" data-ntype="calm"${window._ncCalm?" checked":""}><span class="t">🧊 Calm glitch<span class="d">Stops the infection screen shake (infection still spreads)</span></span></label>`;
}
window._ncCalm=false;
try{window._ncCalm=localStorage.getItem("dwCalm")==="1";}catch(e){}
function dwApplyCalm(){
  if(screen) screen.classList.toggle("calm",!!window._ncCalm);
  try{localStorage.setItem("dwCalm",window._ncCalm?"1":"0");}catch(e){}
}
if(ncList&&!ncList._wired){
  ncList._wired=true;
  ncList.addEventListener("change",e=>{
    const t=e.target&&e.target.dataset&&e.target.dataset.ntype;
    if(t==="calm"){window._ncCalm=e.target.checked;dwApplyCalm();return;}
    if(t){window._ncPrefs[t]=e.target.checked;ncSavePrefs();}
  });
  ncList.addEventListener("click",e=>{
    if(e.target&&e.target.id==="ncBack"){ncRender();return;}
    const item=e.target&&e.target.closest?e.target.closest(".nc-item.clickable"):null;
    if(item){
      const n=window._notis[+(item.dataset.ni)];
      ncClose();
      if(n&&n.msgId!=null) openMessages(n.thread?n.thread:null);
      else if(n&&n.action==="bank") goBank();
    }
  });
}
if(noticenter) noticenter.addEventListener("click",e=>{e.stopPropagation();});
// Steady the infection shake while the player is touching the screen so
// taps land on a stable layout (shake resumes ~1.2s after release).

/* ══ STARTUP PRELOADER ENGINE (cube -> ring -> zoom out, then boots game) ══ */
const shapeContainer = document.getElementById('impossibleShape');
const chamber = document.getElementById('ch3');

const FACES = 6;
const SIZE = 80;
const HALF = SIZE / 2;
const RING_R = 120;

// cube faces: true positions + orientations (front, back, right, left, top, bottom)
const CUBE = [
  { x: 0, y: 0, z: HALF, rx: 0, ry: 0 },
  { x: 0, y: 0, z: -HALF, rx: 0, ry: Math.PI },
  { x: HALF, y: 0, z: 0, rx: 0, ry: Math.PI / 2 },
  { x: -HALF, y: 0, z: 0, rx: 0, ry: -Math.PI / 2 },
  { x: 0, y: -HALF, z: 0, rx: Math.PI / 2, ry: 0 },
  { x: 0, y: HALF, z: 0, rx: -Math.PI / 2, ry: 0 },
];

const faces = [];
for (let i = 0; i < FACES; i++) {
  const el = document.createElement('div');
  el.className = 'shape-face';
  el.style.width = SIZE + 'px';
  el.style.height = SIZE + 'px';
  shapeContainer.appendChild(el);

  const angle = (i / FACES) * Math.PI * 2;
  faces.push({
    el,
    cube: CUBE[i],
    // fixed random tilt so panels never all go edge-on together
    jx: (Math.random() - 0.5) * 0.7,
    jy: (Math.random() - 0.5) * 0.7,
    ring: {
      x: Math.cos(angle) * RING_R,
      y: Math.sin(angle) * RING_R,
      z: Math.sin(angle * 2) * 60,
      rx: angle,
      ry: angle,
    },
  });
}

function paintFace(f, k) {
  const x = f.cube.x + (f.ring.x - f.cube.x) * k;
  const y = f.cube.y + (f.ring.y - f.cube.y) * k;
  const z = f.cube.z + (f.ring.z - f.cube.z) * k;
  // jitter fades in with the break-apart so the cube starts perfect
  const rx = f.cube.rx + (f.ring.rx - f.cube.rx) * k + f.jx * k;
  const ry = f.cube.ry + (f.ring.ry - f.cube.ry) * k + f.jy * k;
  f.el.style.transform =
    `translate(-50%,-50%) translate3d(${x}px,${y}px,${z}px) rotateX(${rx}rad) rotateY(${ry}rad)`;
}

// timeline (seconds) — fully present from frame one, long smooth exit into the game
const T_APART_0 = 1.6;    // fall apart begins
const T_APART_1 = 4.4;    // ring assembled
const T_OUT_0 = 6.2;      // outro begins: faster linear zoom out + fade + blur + desat
const T_END = 8.4;        // game boots
const T_FADE_0 = T_OUT_0;

const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clamp01 = t => Math.min(1, Math.max(0, t));

let rx = -20, ry = 28, rz = 0;
let last = performance.now();
const t0 = last;
let done = false;

paintFaceAll(0);

function paintFaceAll(k) {
  for (const f of faces) paintFace(f, k);
}

function tick(now) {
  if (done) return;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = (now - t0) / 1000;

  // slow continuous tumble (matches old 30s loop: 12 deg/s)
  rx = (rx + 12 * dt) % 360;
  ry = (ry + 12 * dt) % 360;
  rz = (rz + 12 * dt) % 360;

  // fall-apart progress
  const k = easeInOutCubic(clamp01((t - T_APART_0) / (T_APART_1 - T_APART_0)));
  paintFaceAll(k);

  // scale: full size in, then faster LINEAR zoom out
  let s;
  if (t < T_OUT_0) s = 1;
  else s = 1 + 1.5 * clamp01((t - T_OUT_0) / (T_END - T_OUT_0));

  // opacity: fully present, then long smooth fade into the game
  let o;
  if (t < T_FADE_0) o = 1;
  else o = 1 - easeInOutCubic(clamp01((t - T_FADE_0) / (T_END - T_FADE_0)));

  // outro motion blur + desaturation, ramping with the zoom (per-face: container filter would flatten 3D)
  const ok = clamp01((t - T_OUT_0) / (T_END - T_OUT_0));
  const blur = 7 * ok;
  const sat = 1 - 0.8 * ok;

  shapeContainer.style.transform =
    `scale(${s}) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
  const faceFilter = ok > 0 ? `blur(${blur.toFixed(2)}px) saturate(${sat.toFixed(3)})` : 'none';
  for (const f of faces) f.el.style.filter = faceFilter;
  chamber.style.opacity = o.toFixed(3);

  if (t >= T_END) {
    done = true;
    chamber.style.visibility = 'hidden';
    window.dispatchEvent(new Event('chamber-done'));
    return;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
// Failsafe: the preloader grabs every tap (pointer-events:all), so if its
// animation ever stalls the whole phone goes dead. Force it away.
setTimeout(() => {
  if (chamber.style.visibility !== 'hidden') {
    chamber.style.visibility = 'hidden';
    window.dispatchEvent(new Event('chamber-done'));
  }
}, 15000);

const TRAVEL_DAYS = {};
function distKey(a, b) { return a < b ? a + "," + b : b + "," + a; }
function calcDist(c1, c2) {
  return Math.sqrt(Math.pow(c1.x - c2.x, 2) + Math.pow(c1.y - c2.y, 2));
}

    const days = Math.max(1, Math.round(d / 200));
    TRAVEL_DAYS[distKey(i, j)] = days;
  }
}

function randomizePrices() {
  G.prices = DRUGS.map(d => {
    let variance = 0.4 + Math.random() * 1.2;
    let price = Math.round(d.base * variance);
    return Math.max(d.min, Math.min(d.max, price));
  });
  // sometimes a drug becomes unavailable
  if (Math.random() < 0.15) {
    let idx = Math.floor(Math.random() * DRUGS.length);
    G.prices[idx] = 0;
  }
}

function advanceDate(days) {
  for (let i = 0; i < days; i++) {
    G.mday++;
    const daysInMonth = [31,28,31,30,31,30,31,31,30,31,30,31];
    if (G.mday > daysInMonth[G.month - 1]) {
      G.mday = 1;
      G.month++;
      if (G.month > 12) { G.month = 1; G.year++; }
    }
    G.day++;
  }
}

function addLog(msg, type) {
  G.log.unshift({ msg, type });
  if (G.log.length > 50) G.log.pop();
  // Push to phone toast notifications
  if (window.pushGameLog) {
    window.pushGameLog(msg, type);
  }
}

function getDateString() {
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return months[G.month - 1] + " " + G.mday + ", " + G.year;
}

function totalDrugs() {
  return G.inventory.reduce((a, b) => a + b, 0);
}

function netWorth() {
  let invValue = G.inventory.reduce((sum, qty, i) => sum + qty * G.prices[i], 0);
  return G.cash + G.bank + invValue - G.debt;
}

// Top-tab slide animation (demo-style): sliding indicator + content glide.

const TAB_ORDER = ["safehouse", "trap", "market", "hack", "crew", "virus"];
let tabSlideFrom = -1, tabSlideDir = 0;

function goTab(tab) {
  const from = TAB_ORDER.indexOf(G.tab);
  const to = TAB_ORDER.indexOf(tab);
  tabSlideFrom = from >= 0 ? from : to;
  tabSlideDir = to > from ? 1 : to < from ? -1 : 0;
  G.tab = tab;
  render();
}

  if (tab === "hack" && !hasHackDevice()) {

  goTab(tab);
}
