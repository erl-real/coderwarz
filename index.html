<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coderwarz | DayorNight</title>
<meta name="description" content="Coderwarz &amp; DayorNight - game launcher">
<meta property="og:title" content="Coderwarz | DayorNight">
<meta property="og:description" content="Game launcher for Coderwarz and DayorNight">
<meta property="og:type" content="website">
<style>
.aurora-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-10}
.aurora-bg canvas{width:100%!important;height:100%!important;display:block}

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column}

/* Header */
.header{position:fixed;z-index:30;width:100%;top:0;left:0}
.header-inner{max-width:1280px;margin:0 auto;padding:20px 16px;display:flex;align-items:center;justify-content:space-between;animation:fadeSlideIn .5s ease-out .1s both}
.logo{display:block;width:140px;height:36px;background:url('coderwarz (6).png') center/cover no-repeat}
.nav-desktop{display:none;align-items:center;gap:32px}
@media(min-width:768px){.nav-desktop{display:flex}}
.nav-desktop a{color:#94a3b8;text-decoration:none;font-size:14px;transition:color .2s}
.nav-desktop a:hover{color:#fff}
.nav-desktop a.active{color:#fff}
.btn-signin{display:none;align-items:center;gap:8px;border-radius:8px;padding:8px 12px;font-size:14px;color:#cbd5e1;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);cursor:pointer;transition:.2s}
@media(min-width:640px){.btn-signin{display:inline-flex}}
.btn-signin:hover{background:rgba(255,255,255,.1)}
.btn-menu{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#cbd5e1;cursor:pointer;transition:.2s}
@media(min-width:768px){.btn-menu{display:none}}
.btn-menu:hover{background:rgba(255,255,255,.1)}
.btn-menu svg{width:20px;height:20px;transition:transform .3s}

/* Mobile Menu */
.mobile-menu{position:fixed;inset:0;z-index:50;display:none}
.mobile-overlay{position:absolute;inset:0;background:rgba(2,6,23,.8);backdrop-filter:blur(16px);opacity:0;transition:opacity .3s}
.mobile-panel{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:384px;background:rgba(15,23,42,.95);backdrop-filter:blur(24px);border-left:1px solid rgba(255,255,255,.1);box-shadow:0 25px 50px -12px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .3s}
.mobile-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid rgba(255,255,255,.1)}
.mobile-header span{font-size:14px;color:#cbd5e1}
.btn-close{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#cbd5e1;cursor:pointer;transition:.2s}
.btn-close:hover{background:rgba(255,255,255,.1)}
.mobile-nav{padding:24px}
.mobile-nav a{display:block;padding:12px 16px;border-radius:8px;color:#cbd5e1;text-decoration:none;font-size:16px;transition:.2s}
.mobile-nav a:hover{color:#fff;background:rgba(255,255,255,.05)}
.mobile-nav a.active{color:#fff}
.mobile-divider{padding-top:16px;margin-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.mobile-signin{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:8px;font-size:16px;font-weight:500;color:#fff;background:#65a30d;text-decoration:none;transition:.2s}
.mobile-signin:hover{background:#4d7c0f}

/* Gradient Blur */
.gradient-blur{position:fixed;z-index:-10;inset:0 0 auto 0;height:15%;pointer-events:none}
.gradient-blur>div,.gradient-blur::before,.gradient-blur::after{position:absolute;inset:0}
.gradient-blur::before{content:"";z-index:1;backdrop-filter:blur(.5px);mask:linear-gradient(to top,transparent 0%,#000 12.5%,#000 25%,transparent 37.5%)}
.gradient-blur>div:nth-of-type(1){z-index:2;backdrop-filter:blur(1px);mask:linear-gradient(to top,transparent 12.5%,#000 25%,#000 37.5%,transparent 50%)}
.gradient-blur>div:nth-of-type(2){z-index:3;backdrop-filter:blur(2px);mask:linear-gradient(to top,transparent 25%,#000 37.5%,#000 50%,transparent 62.5%)}
.gradient-blur>div:nth-of-type(3){z-index:4;backdrop-filter:blur(4px);mask:linear-gradient(to top,transparent 37.5%,#000 50%,#000 62.5%,transparent 75%)}
.gradient-blur>div:nth-of-type(4){z-index:5;backdrop-filter:blur(8px);mask:linear-gradient(to top,transparent 50%,#000 62.5%,#000 75%,transparent 87.5%)}
.gradient-blur>div:nth-of-type(5){z-index:6;backdrop-filter:blur(16px);mask:linear-gradient(to top,transparent 62.5%,#000 75%,#000 87.5%,transparent 100%)}
.gradient-blur>div:nth-of-type(6){z-index:7;backdrop-filter:blur(32px);mask:linear-gradient(to top,transparent 75%,#000 87.5%,#000 100%)}
.gradient-blur::after{content:"";z-index:8;backdrop-filter:blur(64px);mask:linear-gradient(to top,transparent 87.5%,#000 100%)}

/* Hero */
.hero{flex:1;display:flex;align-items:center;justify-content:center;gap:40px;padding:120px 40px 80px}
.arrow{font-size:48px;cursor:pointer;color:#fff;mix-blend-mode:difference;user-select:none;padding:10px 20px;border:1px solid #fff;transition:.15s}
.arrow:hover{background:#fff;color:#000}
.content{text-align:center;max-width:600px}
.content h1{font-size:48px;margin-bottom:16px;color:#fff;mix-blend-mode:difference}
.content p{font-size:18px;line-height:1.6;margin-bottom:24px;color:#fff;mix-blend-mode:difference}
.content .btn{display:inline-block;padding:12px 32px;border:2px solid #fff;color:#fff;text-decoration:none;font-size:18px;mix-blend-mode:difference;transition:.15s}
.content .btn:hover{background:#fff;color:#000}

/* Footer */
footer{padding:20px 40px;text-align:center;font-size:14px;color:#fff;mix-blend-mode:difference}

@keyframes fadeSlideIn{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <a href="#" class="logo"></a>
    <nav class="nav-desktop">
      <a href="#" class="active" data-tab="coderwarz">CODERWARZ</a>
      <a href="#" data-tab="dayornight">DAYORNIGHT</a>
    </nav>
    <button class="btn-signin">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
      Sign in
    </button>
    <button class="btn-menu" id="mobileMenuBtn">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-overlay" id="mobileMenuOverlay"></div>
    <div class="mobile-panel" id="mobileMenuPanel">
      <div class="mobile-header">
        <span>Menu</span>
        <button class="btn-close" id="mobileMenuClose">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <nav class="mobile-nav">
        <a href="#" class="active" data-tab="coderwarz">CODERWARZ</a>
        <a href="#" data-tab="dayornight">DAYORNIGHT</a>
        <div class="mobile-divider">
          <a href="#" class="mobile-signin">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
            Sign in
          </a>
        </div>
      </nav>
    </div>
  </div>

  <!-- Gradient Blur -->
  <div class="gradient-blur"><div></div><div></div><div></div><div></div><div></div><div></div></div>
</header>

<!-- Background - Aurora -->
<div class="aurora-bg">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const auroraScene = new THREE.Scene();
    const auroraCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const auroraRenderer = new THREE.WebGLRenderer({alpha:true});
    auroraRenderer.setSize(window.innerWidth, window.innerHeight);
    document.querySelector(".aurora-bg").appendChild(auroraRenderer.domElement);

    const auroraMaterial = new THREE.ShaderMaterial({
      uniforms: {
        iTime: { value: 0 },
        iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
      },
      vertexShader: "void main(){gl_Position=vec4(position,1.0);}",
      fragmentShader: `
        uniform float iTime;
        uniform vec2 iResolution;
        #define NUM_OCTAVES 3
        float rand(vec2 n){return fract(sin(dot(n,vec2(12.9898,4.1414)))*43758.5453);}
        float noise(vec2 p){
          vec2 ip=floor(p);vec2 u=fract(p);u=u*u*(3.0-2.0*u);
          float res=mix(mix(rand(ip),rand(ip+vec2(1.0,0.0)),u.x),mix(rand(ip+vec2(0.0,1.0)),rand(ip+vec2(1.0,1.0)),u.x),u.y);
          return res*res;
        }
        float fbm(vec2 x){
          float v=0.0,a=0.3;vec2 shift=vec2(100);mat2 rot=mat2(cos(0.5),sin(0.5),-sin(0.5),cos(0.50));
          for(int i=0;i<NUM_OCTAVES;++i){v+=a*noise(x);x=rot*x*2.0+shift;a*=0.4;}
          return v;
        }
        void main(){
          vec2 shake=vec2(sin(iTime*1.2)*0.005,cos(iTime*2.1)*0.005);
          vec2 p=((gl_FragCoord.xy+shake*iResolution.xy)-iResolution.xy*0.5)/iResolution.y*mat2(6.0,-4.0,4.0,6.0);
          vec2 v;vec4 o=vec4(0.0);
          float f=2.0+fbm(p+vec2(iTime*5.0,0.0))*0.5;
          for(float i=0.0;i++<35.0;){
            v=p+cos(i*i+(iTime+p.x*0.08)*0.025+i*vec2(13.0,11.0))*3.5+vec2(sin(iTime*3.0+i)*0.003,cos(iTime*3.5-i)*0.003);
            float tailNoise=fbm(v+vec2(iTime*0.5,i))*0.3*(1.0-(i/35.0));
            vec4 auroraColors=vec4(0.1+0.3*sin(i*0.2+iTime*0.4),0.3+0.5*cos(i*0.3+iTime*0.5),0.7+0.3*sin(i*0.4+iTime*0.3),1.0);
            vec4 currentContribution=auroraColors*exp(sin(i*i+iTime*0.8))/length(max(v,vec2(v.x*f*0.015,v.y*1.5)));
            float thinnessFactor=smoothstep(0.0,1.0,i/35.0)*0.6;
            o+=currentContribution*(1.0+tailNoise*0.8)*thinnessFactor;
          }
          o=tanh(pow(o/100.0,vec4(1.6)));
          gl_FragColor=o*1.5;
        }
      `
    });

    const auroraGeo = new THREE.PlaneGeometry(2, 2);
    const auroraMesh = new THREE.Mesh(auroraGeo, auroraMaterial);
    auroraScene.add(auroraMesh);

    let auroraPrev = 0;
    function auroraAnimate(now){
      requestAnimationFrame(auroraAnimate);
      if (!auroraPrev) { auroraPrev = now; return; }
      const dt = Math.min((now - auroraPrev) / 1000, 0.05);
      auroraPrev = now;
      auroraMaterial.uniforms.iTime.value += dt;
      auroraRenderer.render(auroraScene, auroraCamera);
    }

    window.addEventListener("resize",()=>{
      auroraRenderer.setSize(window.innerWidth, window.innerHeight);
      auroraMaterial.uniforms.iResolution.value.set(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(auroraAnimate);
  </script>
</div>

<!-- Hero -->
<section class="hero">
  <div class="arrow" id="prev">&#8592;</div>
  <div class="content" id="heroContent">
    <h1 id="gameTitle">CODERWARZ</h1>
    <p id="gameDesc">In development</p>
    <a class="btn" href="#" id="playBtn">OUT SOON</a>
  </div>
  <div class="arrow" id="next">&#8594;</div>
</section>

<footer>
  &copy; Coderwarz - DayorNight - Neverendever.com 2026
</footer>

<script>
const games={
  coderwarz:{title:"CODERWARZ",desc:"In development",build:"builds/coderwarz/",desc_ready:"Ready to play!"},
  dayornight:{title:"DAYORNIGHT",desc:"In development",build:"builds/dayornight/",desc_ready:"Ready to play!"}
};

let current="coderwarz";
let buildStatus={};

async function checkBuilds(){
  for(const [key,game] of Object.entries(games)){
    try{
      const r=await fetch(game.build+"index.html",{method:"HEAD",mode:"same-origin"});
      buildStatus[key]=r.ok;
    }catch(e){buildStatus[key]=false}
  }
  updateView();
}

function updateView(){
  const g=games[current];
  const btn=document.getElementById("playBtn");
  document.getElementById("gameTitle").textContent=g.title;
  document.getElementById("gameDesc").textContent=buildStatus[current]?g.desc_ready:g.desc;
  if(buildStatus[current]){
    btn.textContent="PLAY";
    btn.href=g.build;
    btn.style.display="inline-block";
  }else{
    btn.textContent="OUT SOON";
    btn.href="#";
    btn.style.display="inline-block";
  }
  document.querySelectorAll("[data-tab]").forEach(el=>{
    el.classList.toggle("active",el.dataset.tab===current);
  });
}

checkBuilds();

document.querySelectorAll("[data-tab]").forEach(el=>{
  el.addEventListener("click",e=>{
    e.preventDefault();
    current=el.dataset.tab;
    updateView();
    closeMenu();
  });
});

document.getElementById("prev").addEventListener("click",()=>{
  current=current==="coderwarz"?"dayornight":"coderwarz";
  updateView();
});

document.getElementById("next").addEventListener("click",()=>{
  current=current==="coderwarz"?"dayornight":"coderwarz";
  updateView();
});

// Mobile menu
const menuBtn=document.getElementById("mobileMenuBtn");
const menu=document.getElementById("mobileMenu");
const panel=document.getElementById("mobileMenuPanel");
const closeBtn=document.getElementById("mobileMenuClose");
const overlay=document.getElementById("mobileMenuOverlay");

function openMenu(){
  menu.style.display="block";
  document.body.style.overflow="hidden";
  requestAnimationFrame(()=>{
    panel.style.transform="translateX(0)";
    overlay.style.opacity="1";
  });
}

function closeMenu(){
  panel.style.transform="translateX(100%)";
  overlay.style.opacity="0";
  setTimeout(()=>{
    menu.style.display="none";
    document.body.style.overflow="";
  },300);
}

menuBtn.addEventListener("click",openMenu);
closeBtn.addEventListener("click",closeMenu);
overlay.addEventListener("click",closeMenu);
</script>

</body>
</html>
